<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7fb3e8">
<title>Բեռնատար · Կայանում</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#7fb3e8;color:#fff;touch-action:none;overscroll-behavior:none;position:fixed}
#app{position:fixed;inset:0;overflow:hidden}
@media (orientation:portrait){
  #app{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{background:linear-gradient(165deg,rgba(255,255,255,.94),rgba(230,238,250,.9));border:1px solid rgba(30,60,110,.2);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,20,60,.2);color:#0a1a30}

#topLeft{position:absolute;top:10px;left:10px;padding:9px 16px}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#3a6ea5;font-weight:800}
#distVal{font-size:19px;font-weight:800;margin-top:2px;color:#0a1a30}

#topRight{position:absolute;top:10px;right:10px;padding:9px 16px;text-align:right;min-width:140px}
#spdVal{font-size:33px;font-weight:900;line-height:1;letter-spacing:-1px;color:#0a1a30}
#spdUnit{font-size:10px;color:#3a6ea5;letter-spacing:3px;font-weight:700;margin-top:1px}
#hpWrap{margin-top:8px;height:6px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden}
#hpBar{height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#3ddc84,#2ecc71);transition:width .3s,background .3s}

#mapPanel{position:absolute;top:94px;right:10px;width:148px;height:148px;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,rgba(255,255,255,.94),rgba(230,238,250,.9));border:1px solid rgba(30,60,110,.2);box-shadow:0 6px 20px rgba(0,20,60,.2)}
#mapCanvas{width:100%;height:100%;display:block}

#objWrap{position:absolute;top:58px;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center}
#objArrow{transition:transform .12s linear;filter:drop-shadow(0 3px 10px rgba(200,140,20,.55))}
#objLabel{font-size:11px;font-weight:800;letter-spacing:2px;color:#8a5a00;text-shadow:0 1px 3px rgba(255,255,255,.8);margin-top:2px}

#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:auto;padding:7px 18px;border-radius:12px;font-size:11px;letter-spacing:2px;font-weight:800;color:#0a1a30;cursor:pointer;background:rgba(255,255,255,.9);border:1px solid rgba(30,60,110,.25);backdrop-filter:blur(8px);z-index:25;box-shadow:0 4px 14px rgba(0,20,60,.2)}
#pauseBtn:active{background:rgba(220,230,245,.95)}

#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(210,225,245,.92));border:2.5px solid rgba(50,90,150,.45);box-shadow:0 8px 22px rgba(0,20,60,.3),inset 0 2px 0 rgba(255,255,255,.8);color:#1a3050;font-weight:900;transition:transform .08s,background .12s,border-color .12s;touch-action:none}
.btn:active,.btn.on{transform:scale(.94);background:linear-gradient(160deg,rgba(120,180,255,.96),rgba(70,130,220,.96));border-color:rgba(30,80,160,.9);color:#fff}

#btnL{left:22px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnR{left:152px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnBrake{right:160px;bottom:28px;width:98px;height:98px;font-size:12px;letter-spacing:1.5px;border-color:rgba(200,60,60,.5);color:#a02020}
#btnBrake:active,#btnBrake.on{background:linear-gradient(160deg,rgba(255,80,80,.96),rgba(180,30,30,.96));border-color:#a02020;color:#fff}
#btnGas{right:26px;bottom:20px;width:126px;height:126px;font-size:16px;letter-spacing:2px;border-color:rgba(40,160,80,.5);color:#0a6030}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(70,220,120,.96),rgba(30,150,70,.96));border-color:#0a6030;color:#fff}

#wheelBox{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:112px;height:112px;pointer-events:none;z-index:19;filter:drop-shadow(0 4px 12px rgba(0,20,60,.35))}
#wheelIn{width:100%;height:100%;position:relative;transition:transform .05s linear}
.wRim{position:absolute;inset:0;border-radius:50%;border:10px solid transparent;background:linear-gradient(#f0f4fa,#d0daea) padding-box,conic-gradient(from 200deg,#3a4a68,#6a7a98,#a8b8d8,#6a7a98,#3a4a68,#2a3a58,#6a7a98,#a8b8d8,#6a7a98,#3a4a68) border-box;box-shadow:inset 0 0 12px rgba(0,20,60,.4),0 0 0 1px rgba(50,90,150,.3)}
.wSpk{position:absolute;left:50%;top:50%;width:12px;height:48px;margin-left:-6px;border-radius:4px;background:linear-gradient(180deg,#8a9ab8,#4a5a78);transform-origin:50% 0}
.w1{transform:rotate(180deg)}.w2{transform:rotate(60deg)}.w3{transform:rotate(-60deg)}
.wHub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c0d0e8,#4a5a78 70%);box-shadow:0 0 0 3px #2a3a58,inset 0 2px 3px rgba(255,255,255,.5)}
.wMark{position:absolute;left:50%;top:4px;width:5px;height:15px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(180deg,#e04040,#801010);box-shadow:0 0 6px rgba(200,50,50,.8)}

#camZone{position:absolute;top:0;right:0;width:82px;height:100%;pointer-events:auto;z-index:21;touch-action:none}

#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:72px;font-weight:900;letter-spacing:8px;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.6),0 0 44px rgba(120,190,255,.7);pointer-events:none;opacity:0;z-index:30;white-space:nowrap;color:#fff}
#msg.show{animation:popMsg .9s ease-out}
@keyframes popMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
#msg.red{color:#ff3a3a;text-shadow:0 4px 30px rgba(0,0,0,.7),0 0 44px rgba(255,60,60,.9)}
#msg.gold{color:#ffd45e;text-shadow:0 4px 30px rgba(0,0,0,.7),0 0 44px rgba(255,200,60,.9)}
#msg.green{color:#8affc0;text-shadow:0 4px 30px rgba(0,0,0,.7),0 0 44px rgba(80,255,140,.9)}

.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,rgba(120,180,255,.4),transparent 65%),radial-gradient(ellipse at 50% 100%,rgba(120,220,180,.3),transparent 62%),linear-gradient(170deg,#1a2a48,#0d1a30 45%,#0a1428);transition:opacity .35s}
.screen.hide{opacity:0;pointer-events:none}

#title{font-size:clamp(34px,6.8vw,62px);font-weight:900;letter-spacing:10px;background:linear-gradient(90deg,#7dd3fc,#a78bfa,#fbbf24,#f472b6,#7dd3fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 0 28px rgba(120,180,255,.7))}
@keyframes shine{to{background-position:300% 0}}
#sub{font-size:11px;letter-spacing:7px;color:#8ea8c8;margin-top:-6px;font-weight:700}
#levels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94vw;margin-top:8px}
.lvlBtn{width:76px;height:76px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,rgba(80,110,160,.96),rgba(30,50,90,.96));border:2px solid rgba(150,190,255,.4);box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .12s}
.lvlBtn:active{transform:scale(.93)}
.lvlBtn .n{font-size:24px;font-weight:900;color:#e0ecff}
.lvlBtn .t{font-size:7.5px;letter-spacing:1.2px;color:#a0b8d8;font-weight:700}
.lvlBtn.locked{opacity:.32;filter:grayscale(1);cursor:not-allowed}
.lvlBtn.done{border-color:rgba(80,255,160,.7);box-shadow:0 0 20px rgba(60,230,140,.4),0 6px 20px rgba(0,0,0,.5)}
.lvlBtn.done .n{color:#8affc0}
#startBtn{margin-top:4px;padding:15px 60px;border-radius:50px;cursor:pointer;font-size:19px;font-weight:900;letter-spacing:5px;color:#04121e;background:linear-gradient(90deg,#7dd3fc,#34d399,#fbbf24);background-size:220% 100%;border:none;box-shadow:0 10px 30px rgba(80,180,255,.5);animation:shine 3.8s linear infinite;transition:transform .12s}
#startBtn:active{transform:scale(.95)}
#hint{font-size:10px;color:#8ea8c8;letter-spacing:2px;text-align:center;line-height:1.9;margin-top:4px;max-width:88vw}
.k{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(120,180,255,.16);border:1px solid rgba(150,190,255,.35);color:#b8d4ff;font-weight:700;margin:0 2px}

#endScreen{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,rgba(10,20,40,.88),rgba(3,8,18,.97));backdrop-filter:blur(10px)}
#endScreen.show{display:flex}
#endTitle{font-size:clamp(30px,6vw,56px);font-weight:900;letter-spacing:8px}
#endSub{font-size:13px;letter-spacing:3px;color:#a0b8d8;text-align:center;padding:0 20px}
.endBtn{padding:13px 44px;border-radius:40px;cursor:pointer;font-size:15px;font-weight:900;letter-spacing:3px;border:2px solid rgba(150,190,255,.5);color:#d8e8ff;background:linear-gradient(160deg,rgba(60,90,140,.9),rgba(20,40,80,.9));transition:transform .11s}
.endBtn:active{transform:scale(.95)}
.endBtn.primary{background:linear-gradient(90deg,#7dd3fc,#34d399);color:#04121e;border:none;box-shadow:0 8px 26px rgba(80,180,255,.5)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ՄԱԿԱՐԴԱԿ 1</div>
      <div id="distVal">0 մ</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
      <div id="hpWrap"><div id="hpBar"></div></div>
    </div>

    <div id="mapPanel"><canvas id="mapCanvas" width="300" height="300"></canvas></div>

    <div id="objWrap">
      <svg id="objArrow" width="42" height="42" viewBox="0 0 42 42">
        <path d="M21 3 L33 33 L21 26 L9 33 Z" fill="#fbbf24" stroke="#8a5a00" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <div id="objLabel">0 մ</div>
    </div>

    <div id="pauseBtn">⏸</div>

    <div id="wheelBox">
      <div id="wheelIn">
        <div class="wRim"></div>
        <div class="wSpk w1"></div>
        <div class="wSpk w2"></div>
        <div class="wSpk w3"></div>
        <div class="wHub"></div>
        <div class="wMark"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnBrake">ԱՐԳԵԼ</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
  </div>
  <div id="camZone"></div>

  <div id="msg"></div>

  <div class="screen" id="menu">
    <div id="title">ԲԵՌՆԱՏԱՐ</div>
    <div id="sub">ԿԱՅԱՆՈՒՄ · 3D</div>
    <div id="levels"></div>
    <button id="startBtn">ՍԿՍԵԼ</button>
    <div id="hint">
      <span class="k">◀ ▶</span> ղեկ · <span class="k">ԳԱԶ</span> · <span class="k">ԱՐԳԵԼ</span> · Աջ եզրից ↕ կամերա<br>
      Խուսափի՛ր խոչընդոտներից · Հասի՛ր կայանման գոտուն · <b>Կանգնի՛ր</b>
    </div>
  </div>

  <div id="endScreen">
    <div id="endTitle">—</div>
    <div id="endSub">—</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <div class="endBtn primary" id="btnRetry">ԿՐԿՆԵԼ</div>
      <div class="endBtn" id="btnMenu">ՄԵՆՅՈՒ</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ══════════ ԿԱՅՈՒՆՆԵՐ ══════════ */
const ROAD_HALF = 9;
const SEG_LEN = 6;
const NUM_SEG = 150;
const MAX_KMH = 60;
const TRUCK_LEN = 3.5;
const HITCH_BEHIND = 1.9;     // հետևի առանցքից հետո
const TRAILER_WB = 5.5;       // կցորդի հետևի առանցք → hitch

const LEVELS = [
  {len:180, curve:0,   obstacles:[
    {z:50, x:-3, type:'cone'},
    {z:70, x:0, type:'cone'},
    {z:90, x:3, type:'cone'}
  ], park:{x:0, angle:0}, name:'ՈՒՂԻՂ'},
  {len:220, curve:1, obstacles:[
    {z:60, x:-4, type:'cone'},
    {z:80, x:-4, type:'barrel'},
    {z:100, x:4, type:'barrel'},
    {z:130, x:0, type:'cone'}
  ], park:{x:-3, angle:0.3}, name:'ԿՈՌ'},
  {len:250, curve:-1, obstacles:[
    {z:50, x:-3, type:'cone'},
    {z:60, x:-5, type:'barrier'},
    {z:90, x:-3, type:'barrel'},
    {z:120, x:-3, type:'cone'},
    {z:140, x:4, type:'barrel'},
    {z:170, x:0, type:'cone'}
  ], park:{x:2, angle:-0.4}, name:'ԽԱՉՄԵՐՈՒԿ'},
  {len:280, curve:1.4, obstacles:[
    {z:40, x:-4, type:'cone'},
    {z:70, x:-4, type:'barrel'},
    {z:100, x:0, type:'barrier'},
    {z:130, x:4, type:'barrel'},
    {z:160, x:4, type:'cone'},
    {z:190, x:0, type:'barrel'},
    {z:220, x:-3, type:'cone'}
  ], park:{x:0, angle:0}, name:'S-ԿՈՌ'},
  {len:320, curve:0, obstacles:[
    {z:40, x:-5, type:'cone'},
    {z:55, x:-5, type:'cone'},
    {z:75, x:-4, type:'barrel'},
    {z:100, x:-4, type:'barrel'},
    {z:130, x:4, type:'barrier'},
    {z:160, x:0, type:'cone'},
    {z:190, x:-2, type:'cone'},
    {z:220, x:2, type:'barrel'},
    {z:250, x:0, type:'cone'},
    {z:280, x:4, type:'cone'}
  ], park:{x:-4, angle:0.5}, name:'ԿԱՅԱՆՈՒՄ'}
];

const S = {
  phase:'menu', level:1,
  x:0, z:0, heading:0, speed:0, steer:0,
  trailerX:0, trailerZ:-9, trailerHeading:0,
  health:100, levelLen:180,
  time:0, countdown:0, _lc:undefined,
  hitCd:0,
  camX:0, camY:0, camZ:0, camLX:0, camLY:0, camLZ:0,
  camPitch:0.35,
  best: JSON.parse(localStorage.getItem('truck_v1')||'{}'),
  inPark:false, parking:false
};
const IN = { gas:false, brake:false, left:false, right:false };

/* ══════════ ՁԱՅՆ ══════════ */
const Aud = {
  ctx:null, ready:false, master:null,
  engGain:null, engFilt:null, o1:null, o2:null, o3:null,
  windGain:null, windSrc:null,
  musicGain:null, musicTimer:null, step:0,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.75;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 5;
    this.master.connect(comp);
    comp.connect(this.ctx.destination);

    // ─── ԾԱՆՐ ՇԱՐԺԻՉ (diesel rumble) ───
    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilt = this.ctx.createBiquadFilter();
    this.engFilt.type = 'lowpass';
    this.engFilt.frequency.value = 240;
    this.engFilt.Q.value = 4;
    this.engFilt.connect(this.engGain);
    this.engGain.connect(this.master);

    this.o1 = this.ctx.createOscillator();
    this.o1.type = 'sawtooth'; this.o1.frequency.value = 32;
    const g1 = this.ctx.createGain(); g1.gain.value = 0.8;
    this.o1.connect(g1); g1.connect(this.engFilt); this.o1.start();

    this.o2 = this.ctx.createOscillator();
    this.o2.type = 'square'; this.o2.frequency.value = 48;
    const g2 = this.ctx.createGain(); g2.gain.value = 0.4;
    this.o2.connect(g2); g2.connect(this.engFilt); this.o2.start();

    this.o3 = this.ctx.createOscillator();
    this.o3.type = 'sine'; this.o3.frequency.value = 64;
    const g3 = this.ctx.createGain(); g3.gain.value = 0.5;
    this.o3.connect(g3); g3.connect(this.engFilt); this.o3.start();

    // ─── ՔԱՄ ───
    const bufN = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, bufN, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufN;i++) d[i] = (Math.random()*2-1)*0.4;
    this.windSrc = this.ctx.createBufferSource();
    this.windSrc.buffer = buf; this.windSrc.loop = true;
    const wf = this.ctx.createBiquadFilter();
    wf.type = 'bandpass'; wf.frequency.value = 500; wf.Q.value = 0.6;
    this.windGain = this.ctx.createGain(); this.windGain.gain.value = 0;
    this.windSrc.connect(wf); wf.connect(this.windGain);
    this.windGain.connect(this.master);
    this.windSrc.start();

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0;
    this.musicGain.connect(this.master);
    this.ready = true;
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setEngine(kmh, gas, run){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const f = 26 + kmh * 0.6 + (gas ? 5 : 0);
    this.o1.frequency.setTargetAtTime(f, t, 0.16);
    this.o2.frequency.setTargetAtTime(f*1.5, t, 0.16);
    this.o3.frequency.setTargetAtTime(f*2, t, 0.16);
    this.engFilt.frequency.setTargetAtTime(180 + kmh*5 + (gas ? 180 : 0), t, 0.2);
    const vol = run ? (0.055 + (kmh/MAX_KMH)*0.11 + (gas ? 0.025 : 0)) : 0;
    this.engGain.gain.setTargetAtTime(vol, t, 0.22);
    this.windGain.gain.setTargetAtTime(run ? (kmh/MAX_KMH)*0.045 : 0, t, 0.3);
  },
  _tone(freq, dur, type, vol, slide){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },
  hit(force){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate*0.35);
    const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2);
    const src = this.ctx.createBufferSource(); src.buffer=buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 800;
    const g = this.ctx.createGain(); g.gain.value = 0.25 + force*0.35;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
    this._tone(150 + force*60, 0.25, 'sine', 0.15 + force*0.2, 60);
  },
  brake(){ this._tone(420, 0.15, 'sine', 0.05, 280); },
  ding(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    [523,659,784,1046,1318].forEach((f,i)=>{
      const o = this.ctx.createOscillator();
      o.type='sine'; o.frequency.value=f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.16, t+i*0.09+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.09+0.75);
      o.connect(g); g.connect(this.master);
      o.start(t+i*0.09); o.stop(t+i*0.09+0.8);
    });
  },
  beep(long){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const dur = long ? 0.45 : 0.14;
    const f = long ? 780 : 540;
    const o = this.ctx.createOscillator();
    o.type='triangle'; o.frequency.setValueAtTime(f, t);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.34, t+0.015);
    g.gain.setValueAtTime(0.34, t+dur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.06);
  },
  _mn(freq, at, dur, type, vol, cut){
    const o = this.ctx.createOscillator();
    o.type=type; o.frequency.value=freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    const f = this.ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value = cut;
    o.connect(f); f.connect(g); g.connect(this.musicGain);
    o.start(at); o.stop(at+dur+0.1);
  },
  startMusic(){
    if(!this.ready || this.musicTimer) return;
    this.musicGain.gain.setTargetAtTime(0.4, this.ctx.currentTime, 1.5);
    const CH = [
      [261.63,329.63,392,523.25],
      [220,261.63,329.63,440],
      [174.61,220,261.63,349.23],
      [196,246.94,293.66,392]
    ];
    const BASS = [130.81, 110, 87.31, 98];
    const ARP = [
      523.25,659.25,783.99,1046,783.99,659.25,523.25,392,
      440,523.25,659.25,880,659.25,523.25,440,349.23,
      349.23,440,523.25,698.46,523.25,440,349.23,261.63,
      392,493.88,587.33,783.99,587.33,493.88,392,293.66
    ];
    let next = this.ctx.currentTime + 0.15;
    this.step = 0;
    this.musicTimer = setInterval(()=>{
      if(!this.ready) return;
      while(next < this.ctx.currentTime + 0.4){
        const s = this.step % 32;
        if(s % 8 === 0){
          const chIdx = Math.floor(s/8);
          const ch = CH[chIdx];
          ch.forEach((f,i)=> this._mn(f, next, 3.6, 'sine', 0.032 - i*0.005, 1400));
          this._mn(BASS[chIdx], next, 3.4, 'sine', 0.05, 800);
        }
        this._mn(ARP[s], next, 0.85, 'triangle', 0.024, 2600);
        if(s % 2 === 1){
          const t = next;
          const n = Math.floor(this.ctx.sampleRate*0.04);
          const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,5);
          const src = this.ctx.createBufferSource(); src.buffer=buf;
          const f = this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6500;
          const g = this.ctx.createGain(); g.gain.value = 0.016;
          src.connect(f); f.connect(g); g.connect(this.musicGain);
          src.start(t);
        }
        next += 0.33;
        this.step++;
      }
    }, 100);
  },
  stopMusic(){
    if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer=null; }
    if(this.ready) this.musicGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
  }
};

function roadX(z){
  const lvl = LEVELS[S.level-1];
  const curveAmt = lvl ? lvl.curve : 0;
  return curveAmt * (30*Math.sin(z*0.008) + 15*Math.sin(z*0.021));
}
function roadSlope(z){ const d=0.5; return (roadX(z+d) - roadX(z-d))/(2*d); }
function roadH(z){ return Math.atan(roadSlope(z)); }

  for(const o of obstacles) scene.remove(o.group);

  const lvl = LEVELS[S.level-1];
  for(const def of lvl.obstacles){
    let g;
    if(def.type === 'cone') g = buildCone();
    else if(def.type === 'barrel') g = buildBarrel();
    else g = buildBarrier();
    const wx = roadX(def.z) + def.x;
    g.position.set(wx, 0, def.z);
    g.rotation.y = roadH(def.z);
    scene.add(g);
    obstacles.push({
      group:g,
      x:wx, z:def.z,
      r:def.type === 'barrier' ? 1.3 : 0.5,
      hit:false
    });
  }
}

/* ══════════ ՖԻԶԻԿԱ ══════════ */
const TRUCK_WB = 3.9; // tractor wheelbase

function updatePhysics(dt){
  // ═══ ՂԵԿ ═══
  let target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;
  S.steer += (target - S.steer) * Math.min(1, 5 * dt);
  if(!IN.left && !IN.right){
    S.steer += (0 - S.steer) * Math.min(1, 4 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  // ═══ ԱՐԱԳՈՒԹՅՈՒՆ (km/h) ═══
  if(IN.gas){
    const aMul = 1 - S.speed / MAX_KMH;
    S.speed += 16 * aMul * dt;
  }
  if(IN.brake){
    S.speed -= 42 * dt;
    if(S.speed > 20 && Math.random() < 0.03) Aud.brake();
  }
  if(!IN.gas && !IN.brake){
    S.speed -= 4.5 * dt;
  }
  S.speed = Math.max(0, Math.min(MAX_KMH, S.speed));

  // ═══ ՇԱՐԺՈՒՄ ═══
  const v = S.speed / 3.6;
  const maxSteerAngle = 0.55;
  const steerAngle = S.steer * maxSteerAngle;

  // Bicycle model
  const yawRate = (v / TRUCK_WB) * Math.tan(steerAngle);
  // Sign: right steer (positive) → decrease heading (turn toward -X, screen right)
  S.heading -= yawRate * dt;

  // Move tractor reference (at rear axle midpoint; we'll offset visually)
  S.x += Math.sin(S.heading) * v * dt;
  S.z += Math.cos(S.heading) * v * dt;

  // ═══ ԿՑՈՐԴԻ ՖԻԶԻԿԱ ═══
  // Hitch position on tractor
  const hx = S.x - Math.sin(S.heading) * HITCH_BEHIND;
  const hz = S.z - Math.cos(S.heading) * HITCH_BEHIND;

  // Trailer angular velocity (standard kinematic trailer)
  const alpha = S.heading - S.trailerHeading;
  const omegaT = (v / TRAILER_WB) * Math.sin(alpha);
  S.trailerHeading += omegaT * dt;

  // Clamp articulation
  let rel = S.trailerHeading - S.heading;
  rel = Math.atan2(Math.sin(rel), Math.cos(rel));
  const MAX_ART = 1.35;
  if(rel > MAX_ART) S.trailerHeading = S.heading + MAX_ART;
  if(rel < -MAX_ART) S.trailerHeading = S.heading - MAX_ART;

  // Trailer position (rear axle)
  S.trailerX = hx - Math.sin(S.trailerHeading) * TRAILER_WB;
  S.trailerZ = hz - Math.cos(S.trailerHeading) * TRAILER_WB;

  // ═══ ԲԱԽՈՒՄ ԽՈՉԸՆԴՈՏՆԵՐԻ ՀԵՏ ═══
  if(S.hitCd <= 0){
    checkObstacleCollisions();
  }
  S.hitCd -= dt;

  // ═══ ԿԱՅԱՆՈՒՄ ═══
  const lvl = LEVELS[S.level-1];
  const parkX = roadX(lvl.len) + lvl.park.x;
  const parkZ = lvl.len - 15; // park at end
  parkZone.position.set(parkX, 0, parkZ);
  parkZone.rotation.y = -lvl.park.angle;
  const dxp = S.x - parkX;
  const dzp = S.z - parkZ;
  const dPark = Math.sqrt(dxp*dxp + dzp*dzp);
  const trailerDxP = S.trailerX - parkX;
  const trailerDzP = S.trailerZ - parkZ;
  const dParkT = Math.sqrt(trailerDxP*trailerDxP + trailerDzP*trailerDzP);

  S.inPark = dPark < parkRadius && dParkT < parkRadius + 4;

  if(S.inPark && S.speed < 4 && S.phase === 'play'){
    doWin();
  }

  // ═══ ՎԻԶՈՒԱԼ ═══
  // Tractor position: reference is rear axle midpoint. Cab center is at +1.75 forward.
  const cabOff = 1.75;
  truck.tractor.position.set(
    S.x + Math.sin(S.heading) * cabOff,
    0,
    S.z + Math.cos(S.heading) * cabOff
  );
  truck.tractor.rotation.y = S.heading;

  truck.trailer.position.set(S.trailerX, 0, S.trailerZ);
  truck.trailer.rotation.y = S.trailerHeading;

  // Անիվների պտույտ
  const spin = v * dt * 1.7;
  truck.wheelsTractor.forEach(w => w.mesh.rotation.x -= spin);
  truck.wheelsTrailer.forEach(w => w.rotation.x -= spin);
  // Առջևի անիվների ղեկ
  truck.wheelsTractor.forEach(w=>{
    if(w.steer) w.mesh.rotation.y = S.steer * 0.5;
  });
}

function checkObstacleCollisions(){
  // Tractor circles (2 along length)
  const cabPos = [
    { x: S.x + Math.sin(S.heading) * 1.0, z: S.z + Math.cos(S.heading) * 1.0, r: 1.3 },
    { x: S.x + Math.sin(S.heading) * 3.0, z: S.z + Math.cos(S.heading) * 3.0, r: 1.5 },
    { x: S.x + Math.sin(S.heading) * 4.8, z: S.z + Math.cos(S.heading) * 4.8, r: 1.2 }
  ];
  // Trailer circles (3 along length)
  const trailerPos = [
    { x: S.trailerX + Math.sin(S.trailerHeading) * 1.0, z: S.trailerZ + Math.cos(S.trailerHeading) * 1.0, r: 1.4 },
    { x: S.trailerX + Math.sin(S.trailerHeading) * 3.0, z: S.trailerZ + Math.cos(S.trailerHeading) * 3.0, r: 1.4 },
    { x: S.trailerX + Math.sin(S.trailerHeading) * 5.0, z: S.trailerZ + Math.cos(S.trailerHeading) * 5.0, r: 1.4 }
  ];
  const allCircles = cabPos.concat(trailerPos);

  for(const obs of obstacles){
    if(obs.hit) continue;
    for(const c of allCircles){
      const dx = c.x - obs.x;
      const dz = c.z - obs.z;
      const d = Math.sqrt(dx*dx + dz*dz);
      if(d < c.r + obs.r){
        obs.hit = true;
        onObstacleHit(obs);
        break;
      }
    }
  }
}

function onObstacleHit(obs){
  const sp = S.speed;
  let dmg;
  if(sp > 30) dmg = 25;
  else if(sp > 15) dmg = 12;
  else if(sp > 5) dmg = 5;
  else dmg = 2;
  S.health -= dmg;
  S.speed *= 0.4;
  Aud.hit(Math.min(1, sp/30));
  flashDmg();
  // Խոչընդոտը տապալվում է
  if(obs.group.children.length > 0){
    obs.group.rotation.z = (Math.random()-0.5) * 1.2;
    obs.group.position.y = -0.15;
  }
  if(S.health <= 0){
    doCrash('ՎԹԱՐ', 'Շատ վնաս');
  }
}

/* ══════════ ԿԱՄԵՐԱ ══════════ */
function updateCamera(dt){
  const h = S.heading;
  // Camera behind the trailer (so both tractor and trailer visible)
  const tx = S.trailerX - Math.sin(S.trailerHeading) * (6 - S.camPitch*2);
  const tz = S.trailerZ - Math.cos(S.trailerHeading) * (6 - S.camPitch*2);
  const ty = 4.2 + S.camPitch * 5;

  const k = 1 - Math.exp(-6 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  // Look at midpoint between tractor and trailer
  const midX = (S.x + S.trailerX) / 2;
  const midZ = (S.z + S.trailerZ) / 2;
  const lk = 1 - Math.exp(-7 * dt);
  S.camLX += (midX - S.camLX) * lk;
  S.camLY += (1.5 - S.camLY) * lk;
  S.camLZ += (midZ - S.camLZ) * lk;

  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);

  const tFov = 62 + (S.speed / MAX_KMH) * 8;
  camera.fov += (tFov - camera.fov) * Math.min(1, 3*dt);
  camera.updateProjectionMatrix();
}

/* ══════════ HUD ══════════ */
const mapCv = document.getElementById('mapCanvas');
const mapCtx = mapCv.getContext('2d');

function drawMap(){
  const w = mapCv.width, h = mapCv.height;
  mapCtx.clearRect(0,0,w,h);
  mapCtx.fillStyle = 'rgba(232,240,250,0.85)';
  mapCtx.fillRect(0,0,w,h);

  const range = 250;
  const cx = w/2, cy = h/2;
  const sc = w / range;

  // Road
  mapCtx.strokeStyle = 'rgba(120,120,130,0.6)';
  mapCtx.lineWidth = 22 * sc;
  mapCtx.lineCap = 'round';
  mapCtx.lineJoin = 'round';
  mapCtx.beginPath();
  let first = true;
  for(let z = S.z - range/2; z <= S.z + range/2; z += 8){
    const mx = cx - (roadX(z) - S.x) * sc;
    const my = cy - (z - S.z) * sc;
    if(first){ mapCtx.moveTo(mx,my); first = false; }
    else mapCtx.lineTo(mx,my);
  }
  mapCtx.stroke();

  // Center line
  mapCtx.strokeStyle = 'rgba(220,180,50,0.7)';
  mapCtx.lineWidth = 1.2;
  mapCtx.beginPath();
  first = true;
  for(let z = S.z - range/2; z <= S.z + range/2; z += 8){
    const mx = cx - (roadX(z) - S.x) * sc;
    const my = cy - (z - S.z) * sc;
    if(first){ mapCtx.moveTo(mx,my); first = false; }
    else mapCtx.lineTo(mx,my);
  }
  mapCtx.stroke();

  // Obstacles
  for(const o of obstacles){
    const ox = cx - (o.x - S.x) * sc;
    const oy = cy - (o.z - S.z) * sc;
    if(ox < -8 || ox > w+8 || oy < -8 || oy > h+8) continue;
    mapCtx.fillStyle = o.hit ? 'rgba(150,150,150,0.6)' : '#ff6a2a';
    mapCtx.beginPath();
    mapCtx.arc(ox, oy, 4, 0, 6.3);
    mapCtx.fill();
  }

  // Parking
  const lvl = LEVELS[S.level-1];
  const parkX = roadX(lvl.len) + lvl.park.x;
  const parkZ = lvl.len - 15;
  const px = cx - (parkX - S.x) * sc;
  const py = cy - (parkZ - S.z) * sc;
  if(py > -40 && py < h+40){
    mapCtx.fillStyle = 'rgba(80,200,120,0.35)';
    mapCtx.fillRect(px - 14, py - 20, 28, 40);
    mapCtx.strokeStyle = '#34d399';
    mapCtx.lineWidth = 2;
    mapCtx.strokeRect(px - 14, py - 20, 28, 40);
  }

  // Trailer
  const trx = cx - (S.trailerX - S.x) * sc;
  const try_ = cy - (S.trailerZ - S.z) * sc;
  mapCtx.save();
  mapCtx.translate(trx, try_);
  mapCtx.rotate(-S.trailerHeading);
  mapCtx.fillStyle = '#fbbf24';
  mapCtx.fillRect(-5, -10, 10, 20);
  mapCtx.strokeStyle = '#8a5a00';
  mapCtx.lineWidth = 1;
  mapCtx.strokeRect(-5, -10, 10, 20);
  mapCtx.restore();

  // Tractor
  const ttx = cx - (S.x - S.x) * sc;
  const tty = cy - (S.z - S.z) * sc;
  mapCtx.save();
  mapCtx.translate(ttx, tty);
  mapCtx.rotate(-S.heading);
  mapCtx.fillStyle = '#e11d48';
  mapCtx.beginPath();
  mapCtx.moveTo(0, -8);
  mapCtx.lineTo(-6, 6);
  mapCtx.lineTo(6, 6);
  mapCtx.closePath();
  mapCtx.fill();
  mapCtx.strokeStyle = '#fff';
  mapCtx.lineWidth = 1.5;
  mapCtx.stroke();
  mapCtx.restore();
}

const arrowEl = document.getElementById('objArrow');
const labelEl = document.getElementById('objLabel');
function updateObjective(){
  const lvl = LEVELS[S.level-1];
  const parkX = roadX(lvl.len) + lvl.park.x;
  const parkZ = lvl.len - 15;
  const dx = parkX - S.x;
  const dz = parkZ - S.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  // relative angle from player's forward
  const rel = Math.atan2(dx, dz) - S.heading;
  // On screen: +X_world appears left (since camera faces +Z), so flip
  arrowEl.style.transform = 'rotate(' + (-rel * 180/Math.PI) + 'deg)';
  arrowEl.style.opacity = dist < 40 ? '0.5' : '1';
  labelEl.textContent = Math.max(0, Math.round(dist)) + ' մ';
}

function updateHUD(){
  const sp = Math.round(S.speed);
  document.getElementById('spdVal').textContent = sp;

  const lvl = LEVELS[S.level-1];
  const parkX = roadX(lvl.len) + lvl.park.x;
  const parkZ = lvl.len - 15;
  const dx = parkX - S.x;
  const dz = parkZ - S.z;
  const rem = Math.sqrt(dx*dx + dz*dz);
  document.getElementById('distVal').textContent = Math.round(rem) + ' մ';

  const hp = Math.max(0, Math.min(100, S.health));
  const bar = document.getElementById('hpBar');
  bar.style.width = hp + '%';
  bar.style.background = hp > 60
    ? 'linear-gradient(90deg,#3ddc84,#2ecc71)'
    : hp > 30
      ? 'linear-gradient(90deg,#ffd45e,#ff9a45)'
      : 'linear-gradient(90deg,#ff4d4d,#ff2020)';

  document.getElementById('wheelIn').style.transform = 'rotate(' + (S.steer*150) + 'deg)';
}

let msgT = null;
function showMsg(text, cls){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls || '';
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}

/* ══════════ ՄԱԿԱՐԴԱԿ ══════════ */
function startLevel(n){
  const lvl = LEVELS[n-1];
  S.level = n;
  S.levelLen = lvl.len;
  S.x = roadX(0) + 2.3;
  S.z = 0;
  S.heading = roadH(0);
  S.speed = 0;
  S.steer = 0;
  S.trailerHeading = S.heading;
  S.trailerX = S.x - Math.sin(S.heading) * (HITCH_BEHIND + TRAILER_WB);
  S.trailerZ = S.z - Math.cos(S.heading) * (HITCH_BEHIND + TRAILER_WB);
  S.health = 100;
  S.hitCd = 0;
  S.time = 0;
  S.countdown = 3.0;
  S._lc = undefined;
  S.phase = 'countdown';
  S.camPitch = 0.35;
  S.inPark = false;

  // Init camera
  S.camX = S.trailerX - Math.sin(S.trailerHeading) * 6;
  S.camY = 4.2;
  S.camZ = S.trailerZ - Math.cos(S.trailerHeading) * 6;
  S.camLX = S.x;
  S.camLY = 1.5;
  S.camLZ = S.z;

  spawnObstacles();

  document.getElementById('lvlName').textContent = 'ՄԱԿԱՐԴԱԿ ' + n + ' · ' + lvl.name;
  document.getElementById('hpBar').style.width = '100%';
  document.getElementById('hpBar').style.background = 'linear-gradient(90deg,#3ddc84,#2ecc71)';
  updateHUD();

  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.add('hide');
  document.getElementById('btnRetry').onclick = retryHandler;

  Aud.init(); Aud.resume(); Aud.startMusic();
  showMsg('3', 'gold'); Aud.beep(false);
  S._lc = 3;
}

function doCrash(title, sub){
  if(S.phase === 'crash') return;
  S.phase = 'crash';
  S.speed = 0;
  showMsg(title, 'red');
  setTimeout(()=>{
    document.getElementById('endTitle').textContent = title;
    document.getElementById('endTitle').style.color = '#ff5a5a';
    document.getElementById('endSub').textContent = sub + ' — կրկնի՛ր';
    document.getElementById('btnRetry').textContent = 'ԿՐԿՆԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
  }, 1000);
}

function doWin(){
  if(S.phase === 'win') return;
  S.phase = 'win';
  S.speed = 0;
  Aud.ding();
  showMsg('ԿԱՅԱՆՎԱԾ', 'green');
  if(!S.best['lv'+S.level] || S.best['lv'+S.level] > S.time) S.best['lv'+S.level] = S.time;
  S.best.unlocked = Math.max(S.best.unlocked||1, Math.min(5, S.level+1));
  localStorage.setItem('truck_v1', JSON.stringify(S.best));
  setTimeout(()=>{
    document.getElementById('endTitle').textContent = 'ԿԱՅԱՆՎԱԾ';
    document.getElementById('endTitle').style.color = '#8affc0';
    document.getElementById('endSub').textContent =
      'Մակարդակ ' + S.level + ' · ' + S.time.toFixed(1) + ' վրկ · ' +
      (S.health >= 90 ? '⭐ Անթերի' : S.health >= 60 ? '⭐ Լավ' : 'Ավարտված');
    document.getElementById('btnRetry').textContent = S.level < 5 ? 'ՀԱՋՈՐԴԸ ▶' : 'ԿՐԿՆԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
  }, 1400);
}

/* ══════════ INPUT ══════════ */
function bindHold(el, key){
  const on = e => { e.preventDefault(); IN[key]=true; el.classList.add('on'); Aud.init(); Aud.resume(); };
  const off = e => { e.preventDefault(); IN[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnBrake'), 'brake');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k==='arrowup'||k==='w') IN.gas = true;
  if(k==='arrowdown'||k==='s') IN.brake = true;
  if(k==='arrowleft'||k==='a') IN.left = true;
  if(k==='arrowright'||k==='d') IN.right = true;
  Aud.init(); Aud.resume();
});
addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w') IN.gas = false;
  if(k==='arrowdown'||k==='s') IN.brake = false;
  if(k==='arrowleft'||k==='a') IN.left = false;
  if(k==='arrowright'||k==='d') IN.right = false;
});

(function(){
  const z = document.getElementById('camZone');
  let drag = false, sy = 0, sp = 0;
  const dn = e => { e.preventDefault(); drag=true; const t=e.touches?e.touches[0]:e; sy=t.clientY; sp=S.camPitch; };
  const mv = e => {
    if(!drag) return;
    e.preventDefault();
    const t = e.touches?e.touches[0]:e;
    const dy = t.clientY - sy;
    S.camPitch = Math.max(0.05, Math.min(0.85, sp - dy/320));
  };
  const up = ()=> drag=false;
  z.addEventListener('touchstart', dn, {passive:false});
  z.addEventListener('touchmove', mv, {passive:false});
  z.addEventListener('touchend', up);
  z.addEventListener('mousedown', dn);
  addEventListener('mousemove', mv);
  addEventListener('mouseup', up);
  z.addEventListener('wheel', e=>{
    e.preventDefault();
    S.camPitch = Math.max(0.05, Math.min(0.85, S.camPitch + e.deltaY*0.001));
  }, {passive:false});
})();

document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
document.addEventListener('gestureend', e=>e.preventDefault());
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ══════════ MENU ══════════ */
function buildMenu(){
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  const un = S.best.unlocked || 1;
  for(let i=1;i<=5;i++){
    const d = document.createElement('div');
    d.className = 'lvlBtn';
    if(i > un) d.classList.add('locked');
    if(S.best['lv'+i]) d.classList.add('done');
    d.innerHTML = '<div class="n">' + (S.best['lv'+i]?'★':i) + '</div><div class="t">' + LEVELS[i-1].name + '</div>';
    d.onclick = ()=>{ if(i>un) return; fs(); Aud.init(); Aud.resume(); startLevel(i); };
    wrap.appendChild(d);
  }
}
function fs(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  setTimeout(()=>{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }, 200);
}
document.getElementById('startBtn').onclick = ()=>{
  fs(); Aud.init(); Aud.resume();
  startLevel(Math.min(S.best.unlocked||1, 5));
};
function retryHandler(){
  Aud.resume();
  if(S.phase === 'win' && S.level < 5) startLevel(S.level+1);
  else startLevel(S.level);
}
document.getElementById('btnRetry').onclick = retryHandler;
document.getElementById('btnMenu').onclick = ()=>{
  S.phase = 'menu';
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.remove('hide');
  Aud.stopMusic();
  buildMenu();
};
document.getElementById('pauseBtn').onclick = ()=>{
  if(S.phase === 'play' || S.phase === 'countdown'){
    S.phase = 'paused';
    document.getElementById('endTitle').textContent = 'ԿԱՆԳ';
    document.getElementById('endTitle').style.color = '#9fc6ff';
    document.getElementById('endSub').textContent = 'Դադարեցված է';
    document.getElementById('btnRetry').textContent = 'ՇԱՐՈՒՆԱԿԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
    document.getElementById('btnRetry').onclick = ()=>{
      document.getElementById('endScreen').classList.remove('show');
      S.phase = 'countdown';
      S.countdown = 1.5; S._lc = undefined;
      document.getElementById('btnRetry').onclick = retryHandler;
      Aud.startMusic();
    };
  }
};

/* ══════════ ՉԱՓԵՐ ══════════ */
function resize(){
  const w = app.clientWidth || window.innerWidth;
  const h = app.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 150));

/* ══════════ ՑԻԿԼ ══════════ */
let lastT = performance.now();
let mapT = 0;

function loop(now){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.4, (now - lastT) / 1000);
  lastT = now;
  const dt = Math.min(0.028, rawDt);

  if(S.phase === 'countdown'){
    S.countdown -= rawDt;
    const c = Math.ceil(S.countdown);
    if(c !== S._lc){
      S._lc = c;
      if(c === 2){ showMsg('2','gold'); Aud.beep(false); }
      else if(c === 1){ showMsg('1','gold'); Aud.beep(false); }
      else if(c <= 0){ showMsg('ԳՆԱ՛','green'); Aud.beep(true); }
    }
    if(S.countdown <= 0){
      S.phase = 'play';
      S.time = 0;
      S._lc = undefined;
    }
    updatePhysics(0);
  } else if(S.phase === 'play'){
    S.time += rawDt;
    updatePhysics(dt);
  }

  updateRoad(S.z);
  updateSidewalk(S.z);
  updateScenery(S.z);
  updateCamera(dt);
  updateHUD();
  updateObjective();

  mapT += rawDt;
  if(mapT > 0.05){ mapT = 0; drawMap(); }

  Aud.setEngine(S.speed, IN.gas, S.phase === 'play' || S.phase === 'countdown');

  renderer.render(scene, camera);
}

/* ══════════ INIT ══════════ */
buildMenu();
resize();
updateRoad(0);
updateSidewalk(0);
updateScenery(0);
requestAnimationFrame(loop);

['touchstart','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, ()=>{ Aud.init(); Aud.resume(); }, {once:true});
});

})();
</script>
