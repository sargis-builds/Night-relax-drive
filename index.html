<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060d">
<title>Գիշերային Երթևեկություն</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#04060d;color:#fff;touch-action:none;overscroll-behavior:none;position:fixed}
#app{position:fixed;inset:0;overflow:hidden}
@media (orientation:portrait){
  #app{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%)}
#spdFx{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at 50% 55%,rgba(80,140,255,0) 30%,rgba(120,160,255,.16) 70%,rgba(180,120,255,.24) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 30%,rgba(255,30,30,.8) 100%);transition:opacity .35s}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{background:linear-gradient(165deg,rgba(16,22,42,.85),rgba(8,12,24,.78));border:1px solid rgba(120,180,255,.22);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(0,0,0,.5)}

#topLeft{position:absolute;top:10px;left:10px;padding:8px 16px}
#lvlName{font-size:11px;letter-spacing:2px;color:#7fd4ff;font-weight:700}
#distVal{font-size:20px;font-weight:800;margin-top:2px;background:linear-gradient(90deg,#fff,#9ad8ff);-webkit-background-clip:text;background-clip:text;color:transparent}

#topRight{position:absolute;top:10px;right:10px;padding:8px 16px;text-align:right;min-width:140px}
#spdVal{font-size:34px;font-weight:900;line-height:1;letter-spacing:-1px;background:linear-gradient(90deg,#7ee7ff,#5eb0ff);-webkit-background-clip:text;background-clip:text;color:transparent;transition:filter .15s}
#spdUnit{font-size:10px;color:#8ea3c8;letter-spacing:3px;font-weight:700;margin-top:1px}
#hpWrap{margin-top:8px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#hpBar{height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#3ddc84,#a8ff60);transition:width .2s,background .3s}

#mapPanel{position:absolute;top:96px;right:10px;width:150px;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,rgba(14,20,40,.85),rgba(6,10,22,.8));border:1px solid rgba(120,180,255,.28);box-shadow:0 6px 22px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
#mapCanvas{width:100%;height:100%;display:block}

#objWrap{position:absolute;top:60px;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center}
#objArrow{transition:transform .12s linear;filter:drop-shadow(0 4px 12px rgba(255,190,80,.7))}
#objLabel{font-size:11px;font-weight:800;letter-spacing:2px;color:#ffd45e;text-shadow:0 2px 10px rgba(0,0,0,.9);margin-top:2px}

#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:auto;padding:7px 18px;border-radius:12px;font-size:11px;letter-spacing:2px;font-weight:800;color:#9fc6ff;cursor:pointer;background:rgba(10,16,32,.72);border:1px solid rgba(120,180,255,.3);backdrop-filter:blur(8px);z-index:25}
#pauseBtn:active{background:rgba(30,50,90,.9)}

#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,rgba(30,42,74,.94),rgba(12,18,36,.94));border:2.5px solid rgba(130,190,255,.4);box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.14);color:#cfe4ff;font-weight:900;transition:transform .07s,background .1s,border-color .1s;touch-action:none}
.btn:active,.btn.on{transform:scale(.94);background:linear-gradient(160deg,rgba(80,140,255,.96),rgba(40,80,200,.96));border-color:rgba(180,220,255,.95);color:#fff}

#btnL{left:22px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnR{left:152px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnBrake{right:160px;bottom:28px;width:98px;height:98px;font-size:12px;letter-spacing:1.5px;border-color:rgba(255,120,120,.55);color:#ffb4b4}
#btnBrake:active,#btnBrake.on{background:linear-gradient(160deg,rgba(255,70,70,.96),rgba(180,20,20,.96));border-color:#ff9a9a}
#btnGas{right:26px;bottom:20px;width:126px;height:126px;font-size:16px;letter-spacing:2px;border-color:rgba(120,255,170,.55);color:#b6ffd4}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(50,230,130,.96),rgba(10,150,70,.96));border-color:#a8ffcf}

#wheelBox{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:112px;height:112px;pointer-events:none;z-index:19;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
#wheelIn{width:100%;height:100%;position:relative;transition:transform .04s linear}
.wRim{position:absolute;inset:0;border-radius:50%;border:10px solid transparent;background:linear-gradient(#0d1424,#0d1424) padding-box,conic-gradient(from 200deg,#2a3a5c,#48597f,#8fa8d8,#48597f,#2a3a5c,#1a2438,#48597f,#8fa8d8,#48597f,#2a3a5c) border-box;box-shadow:inset 0 0 14px rgba(0,0,0,.85),0 0 0 1px rgba(150,200,255,.2)}
.wSpk{position:absolute;left:50%;top:50%;width:12px;height:48px;margin-left:-6px;border-radius:4px;background:linear-gradient(180deg,#5f74a0,#2a3550);transform-origin:50% 0}
.w1{transform:rotate(180deg)}.w2{transform:rotate(60deg)}.w3{transform:rotate(-60deg)}
.wHub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a8fc0,#1b2438 70%);box-shadow:0 0 0 3px #0b1120,inset 0 2px 3px rgba(255,255,255,.28)}
.wMark{position:absolute;left:50%;top:4px;width:5px;height:15px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(180deg,#ff5b5b,#a01010);box-shadow:0 0 8px rgba(255,60,60,.9)}

#camZone{position:absolute;top:0;right:0;width:82px;height:100%;pointer-events:auto;z-index:21;touch-action:none}

#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:78px;font-weight:900;letter-spacing:8px;text-align:center;text-shadow:0 0 44px rgba(120,190,255,.9),0 6px 30px rgba(0,0,0,.85);pointer-events:none;opacity:0;z-index:30;white-space:nowrap}
#msg.show{animation:popMsg .85s ease-out}
@keyframes popMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
#msg.red{color:#ff5a5a;text-shadow:0 0 46px rgba(255,60,60,.95),0 6px 30px rgba(0,0,0,.85)}
#msg.gold{color:#ffd45e;text-shadow:0 0 46px rgba(255,200,60,.95),0 6px 30px rgba(0,0,0,.85)}
#msg.green{color:#8affc0;text-shadow:0 0 46px rgba(80,255,140,.9),0 6px 30px rgba(0,0,0,.85)}

.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,rgba(80,60,180,.42),transparent 62%),radial-gradient(ellipse at 50% 100%,rgba(255,110,60,.22),transparent 62%),linear-gradient(170deg,#070b18,#0d1226 45%,#160f22);transition:opacity .35s}
.screen.hide{opacity:0;pointer-events:none}

#title{font-size:clamp(34px,6.8vw,62px);font-weight:900;letter-spacing:10px;background:linear-gradient(90deg,#6ee7ff,#a78bfa,#ff8a5b,#ffd45e,#6ee7ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 0 28px rgba(120,180,255,.55))}
@keyframes shine{to{background-position:300% 0}}
#sub{font-size:11px;letter-spacing:7px;color:#7f93b8;margin-top:-6px;font-weight:700}
#levels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94vw;margin-top:8px}
.lvlBtn{width:76px;height:76px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,rgba(35,48,82,.96),rgba(14,20,38,.96));border:2px solid rgba(120,180,255,.34);box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .12s}
.lvlBtn:active{transform:scale(.93)}
.lvlBtn .n{font-size:24px;font-weight:900;color:#dceaff}
.lvlBtn .t{font-size:7.5px;letter-spacing:1.2px;color:#7f93b8;font-weight:700}
.lvlBtn.locked{opacity:.32;filter:grayscale(1);cursor:not-allowed}
.lvlBtn.done{border-color:rgba(80,255,160,.7);box-shadow:0 0 20px rgba(60,230,140,.35),0 6px 20px rgba(0,0,0,.5)}
.lvlBtn.done .n{color:#8affc0}
#startBtn{margin-top:4px;padding:15px 60px;border-radius:50px;cursor:pointer;font-size:19px;font-weight:900;letter-spacing:5px;color:#04121e;background:linear-gradient(90deg,#5eead4,#60a5fa,#a78bfa);background-size:220% 100%;border:none;box-shadow:0 10px 30px rgba(90,150,255,.5);animation:shine 3.8s linear infinite;transition:transform .12s}
#startBtn:active{transform:scale(.95)}
#hint{font-size:10px;color:#61748f;letter-spacing:2px;text-align:center;line-height:1.9;margin-top:4px;max-width:88vw}
.k{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(120,180,255,.16);border:1px solid rgba(120,180,255,.3);color:#a8ccff;font-weight:700;margin:0 2px}

#endScreen{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,rgba(10,16,32,.85),rgba(3,5,12,.97));backdrop-filter:blur(10px)}
#endScreen.show{display:flex}
#endTitle{font-size:clamp(30px,6vw,56px);font-weight:900;letter-spacing:8px}
#endSub{font-size:13px;letter-spacing:3px;color:#8ea3c8;text-align:center;padding:0 20px}
.endBtn{padding:13px 44px;border-radius:40px;cursor:pointer;font-size:15px;font-weight:900;letter-spacing:3px;border:2px solid rgba(130,190,255,.5);color:#cfe4ff;background:linear-gradient(160deg,rgba(40,60,110,.9),rgba(14,20,38,.9));transition:transform .11s}
.endBtn:active{transform:scale(.95)}
.endBtn.primary{background:linear-gradient(90deg,#5eead4,#60a5fa);color:#04121e;border:none;box-shadow:0 8px 26px rgba(90,150,255,.5)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="spdFx"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ՄԱԿԱՐԴԱԿ 1</div>
      <div id="distVal">0 մ</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
      <div id="hpWrap"><div id="hpBar"></div></div>
    </div>

    <div id="mapPanel"><canvas id="mapCanvas" width="300" height="300"></canvas></div>

    <div id="objWrap">
      <svg id="objArrow" width="42" height="42" viewBox="0 0 42 42">
        <path d="M21 3 L33 33 L21 26 L9 33 Z" fill="#ffd45e" stroke="#a67c1a" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <div id="objLabel">0 մ</div>
    </div>

    <div id="pauseBtn">⏸</div>

    <div id="wheelBox">
      <div id="wheelIn">
        <div class="wRim"></div>
        <div class="wSpk w1"></div>
        <div class="wSpk w2"></div>
        <div class="wSpk w3"></div>
        <div class="wHub"></div>
        <div class="wMark"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnBrake">ԱՐԳԵԼ</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
  </div>
  <div id="camZone"></div>

  <div id="msg"></div>

  <div class="screen" id="menu">
    <div id="title">ԳԻՇԵՐԱՅԻՆ</div>
    <div id="sub">ԵՐԹԵՎԵԿՈՒԹՅՈՒՆ · 3D</div>
    <div id="levels"></div>
    <button id="startBtn">ՍԿՍԵԼ</button>
    <div id="hint">
      <span class="k">◀ ▶</span> ղեկ · <span class="k">ԳԱԶ</span> · <span class="k">ԱՐԳԵԼ</span> · Աջ եզրից ↕ կամերա<br>
      Հասի՛ր նպատակին, <b>կանգնի՛ր</b> · 150+ = վթար
    </div>
  </div>

  <div id="endScreen">
    <div id="endTitle">—</div>
    <div id="endSub">—</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <div class="endBtn primary" id="btnRetry">ԿՐԿՆԵԼ</div>
      <div class="endBtn" id="btnMenu">ՄԵՆՅՈՒ</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ═══════════ ԿԱՅՈՒՆՆԵՐ ═══════════ */
const ROAD_HALF = 9;
const SEG_LEN   = 6;
const NUM_SEG   = 180;
const LANE_OFF  = [-6.5, -2.2, 2.2, 6.5];
const MAX_SPEED = 180;
const KMH_MS    = 1/3.6;
const LEVELS = [
  {len:2200, spawn:1.7, name:'ՔԱՂԱՔ'},
  {len:2600, spawn:1.4, name:'ՄԱՅՐՈՒՂԻ'},
  {len:3000, spawn:1.2, name:'ԽԱՉՄԵՐՈՒԿ'},
  {len:3400, spawn:1.0, name:'ԱՎՏՈԲԱՀՆ'},
  {len:3800, spawn:0.85,name:'ՄԵԾ ԽՃՈՒՄ'}
];

/* ═══════════ ՎԻՃԱԿ ═══════════ */
const S = {
  phase:'menu', level:1,
  speed:0, x:0, z:0, heading:0,
  steer:0, health:100, levelLen:2200,
  hitCd:0, shake:0,
  camX:0, camY:0, camZ:0,
  camLX:0, camLY:0, camLZ:0,
  camPitch:0.18,
  time:0, countdown:0, _lastC:undefined,
  best: JSON.parse(localStorage.getItem('night_v3')||'{}')
};
const IN = { gas:false, brake:false, left:false, right:false };

/* ═══════════ ՁԱՅՆ ═══════════ */
const Aud = {
  ctx:null, ready:false, master:null,
  engGain:null, engFilt:null, o1:null, o2:null,
  musicGain:null, musicTimer:null, step:0,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.72;
    this.master.connect(this.ctx.destination);

    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilt = this.ctx.createBiquadFilter();
    this.engFilt.type='lowpass';
    this.engFilt.frequency.value = 320;
    this.engFilt.Q.value = 1.4;
    this.engFilt.connect(this.engGain);
    this.engGain.connect(this.master);

    this.o1 = this.ctx.createOscillator();
    this.o1.type = 'sine'; this.o1.frequency.value = 42;
    const g1 = this.ctx.createGain(); g1.gain.value = 1.0;
    this.o1.connect(g1); g1.connect(this.engFilt); this.o1.start();

    this.o2 = this.ctx.createOscillator();
    this.o2.type = 'triangle'; this.o2.frequency.value = 63;
    const g2 = this.ctx.createGain(); g2.gain.value = 0.5;
    this.o2.connect(g2); g2.connect(this.engFilt); this.o2.start();

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0;
    this.musicGain.connect(this.master);
    this.ready = true;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setEngine(sp, run){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const f = 40 + sp * 0.7;
    this.o1.frequency.setTargetAtTime(f, t, 0.14);
    this.o2.frequency.setTargetAtTime(f*1.5, t, 0.14);
    this.engFilt.frequency.setTargetAtTime(260 + sp*4, t, 0.18);
    this.engGain.gain.setTargetAtTime(run ? 0.05 + (sp/MAX_SPEED)*0.085 : 0, t, 0.22);
  },
  beep(long){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const dur = long ? 0.42 : 0.13;
    const freq = long ? 720 : 520;
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.36, t+0.012);
    g.gain.setValueAtTime(0.36, t + dur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },
  _tone(freq, dur, vol, slide){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },
  crash(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate*0.65);
    const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6);
    const s = this.ctx.createBufferSource(); s.buffer=buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1300;
    const g = this.ctx.createGain(); g.gain.value=0.55;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
    this._tone(150, 0.55, 0.4, 32);
  },
  bump(force){ this._tone(180+force*40, 0.2, 0.06+force*0.16, 90); },
  ding(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    [660,880,1320].forEach((f,i)=>{
      const o = this.ctx.createOscillator();
      o.type='sine'; o.frequency.value=f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t+i*0.1);
      g.gain.exponentialRampToValueAtTime(0.16, t+i*0.1+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.1+0.55);
      o.connect(g); g.connect(this.master);
      o.start(t+i*0.1); o.stop(t+i*0.1+0.6);
    });
  },
  _n(freq, at, dur, type, vol, cut){
    const o = this.ctx.createOscillator();
    o.type = type; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    const f = this.ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value = cut;
    o.connect(f); f.connect(g); g.connect(this.musicGain);
    o.start(at); o.stop(at+dur+0.08);
  },
  startMusic(){
    if(!this.ready || this.musicTimer) return;
    this.musicGain.gain.setTargetAtTime(0.4, this.ctx.currentTime, 1.2);
    const CH = [
      [220,261.63,329.63], [174.61,220,261.63],
      [196,246.94,293.66], [261.63,329.63,392]
    ];
    const ARP = [523.25,659.25,783.99,659.25,523.25,440,392,440,
                 440,523.25,659.25,523.25,440,392,349.23,392];
    let next = this.ctx.currentTime + 0.1;
    this.step = 0;
    this.musicTimer = setInterval(()=>{
      if(!this.ready) return;
      while(next < this.ctx.currentTime + 0.35){
        const s = this.step % 16;
        if(s === 0){
          const ch = CH[Math.floor(this.step/16)%4];
          ch.forEach((f,i)=>this._n(f, next, 2.4, 'sine', 0.033-i*0.005, 1100));
        }
        this._n(ARP[s], next, 0.85, 'triangle', 0.026, 2600);
        next += 0.32; this.step++;
      }
    }, 90);
  },
  stopMusic(){
    if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer=null; }
    if(this.ready) this.musicGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.4);
  }
};

function makeGlowTex(r,g,b){
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  const x = cv.getContext('2d');
  const grad = x.createRadialGradient(32,32,0, 32,32,32);
  grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.35, `rgba(${r},${g},${b},0.55)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = grad;
  x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}

function roadX(z){ return 24*Math.sin(z*0.0048) + 10*Math.sin(z*0.0131) + 3.5*Math.sin(z*0.029); }
function roadSlope(z){ const d=0.6; return (roadX(z+d)-roadX(z-d))/(2*d); }
function roadH(z){ return Math.atan(roadSlope(z)); }

function makeRoadTex(){
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  const x = cv.getContext('2d');
  x.fillStyle = '#1c1f26'; x.fillRect(0,0,128,256);
  for(let i=0;i<2200;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.06)';
    x.fillRect(Math.random()*128, Math.random()*256, 1.2, 1.2);
  }
  x.fillStyle = '#c8c8c8';
  x.fillRect(3,0,3,256); x.fillRect(122,0,3,256);
  x.fillStyle = '#d8b840';
  x.fillRect(59,0,3,256); x.fillRect(66,0,3,256);
  x.fillStyle = '#b8b8b8';
  for(let y=0;y<256;y+=128){ x.fillRect(32,y,3,64); x.fillRect(93,y,3,64); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 2;
  return t;
}

const WALL_H = 1.0;

function updateRoad(pz){
  const startZ = pz - 100;
  for(let i=0;i<=NUM_SEG;i++){
    const z = startZ + i*SEG_LEN;
    const cx = roadX(z);
    const o = i*6;
    rp[o]=cx-ROAD_HALF; rp[o+1]=0; rp[o+2]=z;
    rp[o+3]=cx+ROAD_HALF; rp[o+4]=0; rp[o+5]=z;
    const u = i*4;
    ru[u]=0; ru[u+1]=z/16;
    ru[u+2]=1; ru[u+3]=z/16;

    const w = i*12;
    bp[w]   = cx-ROAD_HALF; bp[w+1]=WALL_H; bp[w+2]=z;
    bp[w+3] = cx-ROAD_HALF; bp[w+4]=0;      bp[w+5]=z;
    bp[w+6] = cx+ROAD_HALF; bp[w+7]=WALL_H; bp[w+8]=z;
    bp[w+9] = cx+ROAD_HALF; bp[w+10]=0;     bp[w+11]=z;
  }
  roadGeo.attributes.position.needsUpdate = true;
  roadGeo.attributes.uv.needsUpdate = true;
  barrierGeo.attributes.position.needsUpdate = true;
}

function updateScenery(pz){
  for(let i=0;i<buildings.length;i++){
    const b = buildings[i];
    while(b.userData.z < pz - 130) b.userData.z += 2400;
    const z = b.userData.z;
    const side = b.userData.side;
    b.position.set(roadX(z) + side*(b.userData.offset + b.userData.w/2), b.userData.h/2, z);
    b.rotation.y = Math.atan(roadSlope(z));
  }
  for(let i=0;i<lamps.length;i++){
    const l = lamps[i];
    while(l.userData.z < pz - 100) l.userData.z += 2400;
    const z = l.userData.z;
    const side = l.userData.side;
    l.position.set(roadX(z) + side*(ROAD_HALF + 3.2), 0, z);
    l.rotation.y = (side > 0 ? 0 : Math.PI) + Math.atan(roadSlope(z));

const TRAFFIC_COLORS = [0xff4040,0x4a9dff,0xffd24a,0x4affa0,0xff8a3d,0xb44aff,0xd8dce5,0x22d3d3];
const traffic = [];

for(let i=0;i<10;i++){
  const c = makeCarModel(TRAFFIC_COLORS[i % TRAFFIC_COLORS.length], false);
  c.group.visible = false;
  scene.add(c.group);

function spawnTraffic(){
  const lvl = LEVELS[S.level-1];
  const free = POOL.find(c => !c.group.visible);
  if(!free) return;
  const lane = Math.floor(Math.random()*4);
  const onc = lane < 2;
  const z = S.z + 320 + Math.random()*280;
  let near = 0;
  for(const t of traffic) if(Math.abs(t.z - z) < 130) near++;
  if(near >= 2) return;
  for(const t of traffic) if(t.lane === lane && Math.abs(t.z - z) < 80) return;
  const spd = onc ? 15 + Math.random()*7 : 10 + Math.random()*6;
  free.group.visible = true;
  free.group.position.set(0,0,z);
  traffic.push({ obj:free, lane, off:LANE_OFF[lane], z, dir:onc?-1:1, spd });
}

function updateTraffic(dt){
  for(let i=traffic.length-1;i>=0;i--){
    const t = traffic[i];
    t.z += t.dir * t.spd * dt;
    const cx = roadX(t.z) + t.off;
    t.obj.group.position.set(cx, 0, t.z);
    let h = Math.atan(roadSlope(t.z));
    if(t.dir < 0) h += Math.PI;
    t.obj.group.rotation.y = h;
    for(const w of t.obj.wheels) w.mesh.rotation.x -= t.spd * dt * 1.7;
    if(t.z < S.z - 70 || t.z > S.z + 1400){
      t.obj.group.visible = false;
      traffic.splice(i,1);
    }
  }
}
function clearTraffic(){
  for(const t of traffic) t.obj.group.visible = false;
  traffic.length = 0;
}

/* ═══════════ ԲԱԽՈՒՄ ═══════════ */
function checkCollisions(){
  if(S.hitCd > 0) return;
  for(let i=traffic.length-1;i>=0;i--){
    const t = traffic[i];
    const cx = t.obj.group.position.x;
    const cz = t.obj.group.position.z;
    if(Math.abs(S.x - cx) < 1.85 && Math.abs(S.z - cz) < 3.8){
      handleHit(t, i); return;
    }
  }
}
function handleHit(t, idx){
  S.hitCd = 0.7;
  const sp = S.speed;
  if(sp >= 150){ Aud.crash(); doCrash('ՎԹԱՐ', 'Արագությունը չափազանց բարձր էր'); return; }
  let dmg;
  if(sp >= 110) dmg = 48;
  else if(sp >= 80) dmg = 30;
  else if(sp >= 50) dmg = 15;
  else if(sp >= 25) dmg = 7;
  else dmg = 2;
  S.health -= dmg;
  S.speed *= (sp >= 80 ? 0.42 : 0.7);
  S.shake = Math.min(1.4, 0.3 + sp/180);
  flashDmg();
  Aud.bump(Math.min(1, sp/150));
  t.obj.group.visible = false;
  traffic.splice(idx,1);
  if(S.health <= 0){ Aud.crash(); doCrash('ՎԹԱՐ', 'Մեքենան վնասվեց'); }
}
function flashDmg(){
  const e = document.getElementById('flash');
  e.style.transition='none'; e.style.opacity='1';
  requestAnimationFrame(()=>{ e.style.transition='opacity .5s'; e.style.opacity='0'; });
}

/* ═══════════ ՄԱԿԱՐԴԱԿ ═══════════ */
function startLevel(n){
  const lvl = LEVELS[n-1];
  S.level = n; S.levelLen = lvl.len;
  S.speed = 0; S.z = 0;
  S.x = roadX(0) + LANE_OFF[2];
  S.heading = roadH(0);
  S.steer = 0; S.health = 100;
  S.hitCd = 0; S.shake = 0; S.time = 0;
  S.countdown = 3.0; S._lastC = undefined;
  S.phase = 'countdown';
  S.camPitch = 0.18;

  S.camX = S.x - Math.sin(S.heading)*9;
  S.camY = 3.6;
  S.camZ = S.z - Math.cos(S.heading)*9;
  S.camLX = S.x; S.camLY = 1.5; S.camLZ = S.z + 10;

  clearTraffic();
  player.group.position.set(S.x, 0, S.z);
  player.group.rotation.y = S.heading;

  document.getElementById('lvlName').textContent = 'ՄԱԿԱՐԴԱԿ ' + n + ' · ' + lvl.name;
  document.getElementById('hpBar').style.width = '100%';
  document.getElementById('hpBar').style.background = 'linear-gradient(90deg,#3ddc84,#a8ff60)';
  updateHUD();

  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.add('hide');
  document.getElementById('btnRetry').onclick = retryHandler;

  Aud.init(); Aud.resume(); Aud.startMusic();
  // ցույց տալ "3" և միանգամից beep
  showMsg('3', 'gold');
  Aud.beep(false);
  S._lastC = 3;
}
function doCrash(title, sub){
  if(S.phase === 'crash') return;
  S.phase = 'crash'; S.speed = 0; S.shake = 1.6;
  showMsg(title, 'red');
  setTimeout(()=>{
    document.getElementById('endTitle').textContent = title;
    document.getElementById('endTitle').style.color = '#ff5a5a';
    document.getElementById('endSub').textContent = sub + ' — կրկնի՛ր';
    document.getElementById('btnRetry').textContent = 'ԿՐԿՆԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
  }, 900);
}
function doWin(){
  if(S.phase === 'win') return;
  S.phase = 'win'; S.speed = 0;
  Aud.ding();
  showMsg('ՀԱՂԹԱՆԱԿ', 'green');
  if(!S.best['lv'+S.level] || S.best['lv'+S.level] > S.time) S.best['lv'+S.level] = S.time;
  S.best.unlocked = Math.max(S.best.unlocked||1, Math.min(5, S.level+1));
  localStorage.setItem('night_v3', JSON.stringify(S.best));
  setTimeout(()=>{
    document.getElementById('endTitle').textContent = 'ՀԱՂԹԱՆԱԿ';
    document.getElementById('endTitle').style.color = '#8affc0';
    document.getElementById('endSub').textContent = 'Մակարդակ ' + S.level + ' · ' + S.time.toFixed(1) + ' վրկ';
    document.getElementById('btnRetry').textContent = S.level < 5 ? 'ՀԱՋՈՐԴԸ ▶' : 'ԿՐԿՆԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
  }, 1100);
}

/* ═══════════ ՖԻԶԻԿԱ — արագ, ուղիղ ═══════════ */
function updatePhysics(dt){
  // արագացում
  if(IN.gas){
    const a = S.speed < 60 ? 78 : (S.speed < 130 ? 52 : 30);
    S.speed += a * dt;
  }
  if(IN.brake) S.speed -= 130 * dt;
  if(!IN.gas && !IN.brake) S.speed -= 18 * dt;
  if(S.speed < 0) S.speed = 0;
  if(S.speed > MAX_SPEED) S.speed = MAX_SPEED;

  // ղեկ — արագ արձագանք
  let tgt = 0;
  if(IN.left) tgt = -1;
  if(IN.right) tgt = 1;
  if(tgt !== 0){
    S.steer += (tgt - S.steer) * Math.min(1, 14 * dt);
  } else {
    S.steer += (0 - S.steer) * Math.min(1, 12 * dt);
    if(Math.abs(S.steer) < 0.004) S.steer = 0;
  }

  // պտույտ. աջ = heading նվազում
  const spF = Math.min(1, S.speed / 25);
  const damp = 1 - 0.25 * Math.min(1, S.speed / MAX_SPEED);
  S.heading -= S.steer * 2.8 * spF * damp * dt;

  // դիրք
  const v = S.speed * KMH_MS;
  S.x += Math.sin(S.heading) * v * dt;
  S.z += Math.cos(S.heading) * v * dt;

  // պատնեշ
  const cX = roadX(S.z);
  const off = S.x - cX;
  const lim = ROAD_HALF - 1.1;
  if(off > lim){
    S.x = cX + lim;
    if(S.speed > 40) S.speed -= 30 * dt;
    S.shake = Math.max(S.shake, 0.06);
  } else if(off < -lim){
    S.x = cX - lim;
    if(S.speed > 40) S.speed -= 30 * dt;
    S.shake = Math.max(S.shake, 0.06);
  }

  S.hitCd -= dt;

  // մեքենայի տեսք
  player.group.position.set(S.x, 0, S.z);
  player.group.rotation.y = S.heading;
  const spin = (S.speed * KMH_MS) * dt * 1.7;
  for(const w of player.wheels){
    w.mesh.rotation.x -= spin;
    if(w.tag === 'fl' || w.tag === 'fr') w.mesh.rotation.y = S.steer * 0.55;
  }
  // արգելակային լույս
  const braking = IN.brake || (!IN.gas && S.speed > 3);
  player.tailGlow.material.opacity = braking ? 1.0 : 0.55;
  player.tlMat.color.setHex(braking ? 0xff1010 : 0xff2020);

  // կանգառի գոտի
  const zoneStart = S.levelLen - 220;
  if(S.z >= zoneStart && S.z < S.levelLen + 30 && S.phase === 'play'){
    if(S.speed < 7) doWin();
  }
  if(S.z > S.levelLen + 40 && S.phase === 'play'){
    Aud.crash();
    doCrash('ԲԱԽՈՒՄ', 'Անցար վերջնագիծը առանց կանգնելու');
  }
}

/* ═══════════ ԿԱՄԵՐԱ — սահուն, արագ ═══════════ */
function updateCamera(dt){
  const h = S.heading;
  const fx = Math.sin(h), fz = Math.cos(h);

  const dist = 9.5 - S.camPitch * 3.5;
  const high = 3.4 + S.camPitch * 4.5;

  const tx = S.x - fx * dist;
  const ty = high;
  const tz = S.z - fz * dist;

  // framerate-independent smoothing (rate=20 ≈ շատ արագ, բայց սահուն)
  const k = 1 - Math.exp(-20 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  const lx = S.x + fx * 12 + S.steer * 2.0;
  const ly = 1.5;
  const lz = S.z + fz * 12;
  const lk = 1 - Math.exp(-22 * dt);
  S.camLX += (lx - S.camLX) * lk;
  S.camLY += (ly - S.camLY) * lk;
  S.camLZ += (lz - S.camLZ) * lk;

  let sx = 0, sy = 0;
  if(S.shake > 0.005){
    sx = (Math.random()-0.5) * S.shake * 0.9;
    sy = (Math.random()-0.5) * S.shake * 0.7;
    S.shake *= Math.pow(0.03, dt);
    if(S.shake < 0.005) S.shake = 0;
  }

  camera.position.set(S.camX + sx, S.camY + sy, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);

  const tFov = 72 + (S.speed / MAX_SPEED) * 14;
  camera.fov += (tFov - camera.fov) * Math.min(1, 5*dt);
  camera.updateProjectionMatrix();
  camera.rotation.z += S.steer * 0.022;
}

/* ═══════════ HUD + MAP + ARROW ═══════════ */
const mapCv = document.getElementById('mapCanvas');
const mapCtx = mapCv.getContext('2d');
function drawMap(){
  const w = mapCv.width, h = mapCv.height;
  mapCtx.clearRect(0,0,w,h);
  mapCtx.fillStyle = 'rgba(6,10,22,0.5)';
  mapCtx.fillRect(0,0,w,h);
  const range = 300;
  const cx = w/2, cy = h/2;
  const sc = w / range;
  // ճանապարհ
  mapCtx.strokeStyle = 'rgba(120,180,255,0.55)';
  mapCtx.lineWidth = 22 * sc;
  mapCtx.lineCap = 'round';
  mapCtx.beginPath();
  for(let z = S.z - range/2; z <= S.z + range/2; z += 10){
    const mx = cx + (roadX(z) - S.x) * sc;
    const my = cy - (z - S.z) * sc;
    if(z === S.z - range/2 + (S.z - range/2)%10 ) mapCtx.moveTo(mx,my);
    else mapCtx.lineTo(mx, my);
  }
  mapCtx.stroke();
  // թրաֆիկ
  mapCtx.fillStyle = '#ff5a5a';
  for(const t of traffic){
    const tx = cx + (t.obj.group.position.x - S.x) * sc;
    const ty = cy - (t.obj.group.position.z - S.z) * sc;
    if(tx < -6 || tx > w+6 || ty < -6 || ty > h+6) continue;
    mapCtx.beginPath(); mapCtx.arc(tx, ty, 4, 0, 6.3); mapCtx.fill();
  }
  // նպատակակետ
  const fz = S.levelLen;
  const fx = cx + (roadX(fz) - S.x) * sc;
  const fy = cy - (fz - S.z) * sc;
  if(fy > -20 && fy < h+20){
    mapCtx.fillStyle = '#ffd45e';
    mapCtx.beginPath(); mapCtx.arc(fx, fy, 8, 0, 6.3); mapCtx.fill();
    mapCtx.strokeStyle = '#fff'; mapCtx.lineWidth = 2; mapCtx.stroke();
  }
  // խաղացող (եռանկյուն)
  mapCtx.save();
  mapCtx.translate(cx, cy);
  mapCtx.rotate(-S.heading);
  mapCtx.fillStyle = '#5eead4';
  mapCtx.beginPath();
  mapCtx.moveTo(0, -10); mapCtx.lineTo(-7, 8); mapCtx.lineTo(7, 8);
  mapCtx.closePath(); mapCtx.fill();
  mapCtx.strokeStyle = '#fff'; mapCtx.lineWidth = 1.5; mapCtx.stroke();
  mapCtx.restore();
}
const arrowEl = document.getElementById('objArrow');
const labelEl = document.getElementById('objLabel');
function updateObjective(){
  const dz = S.levelLen - S.z;
  const dx = roadX(S.levelLen) - S.x;
  const dist = Math.sqrt(dx*dx + dz*dz);
  const rel = Math.atan2(dx, dz) - S.heading;
  arrowEl.style.transform = 'rotate(' + (rel * 180/Math.PI) + 'deg)';
  arrowEl.style.opacity = dist < 200 ? '0.5' : '1';
  labelEl.textContent = Math.max(0, Math.round(dist)) + ' մ';
}

function updateHUD(){
  const sp = Math.round(S.speed);
  const e = document.getElementById('spdVal');
  e.textContent = sp;
  if(sp >= 150) e.style.background = 'linear-gradient(90deg,#ff5a5a,#ff2b2b)';
  else if(sp >= 100) e.style.background = 'linear-gradient(90deg,#ffd36e,#ff7a45)';
  else e.style.background = 'linear-gradient(90deg,#7ee7ff,#5eb0ff)';
  e.style.webkitBackgroundClip = 'text';
  e.style.backgroundClip = 'text';
  const rem = Math.max(0, S.levelLen - S.z);
  document.getElementById('distVal').textContent = Math.round(rem) + ' մ';
  const hp = Math.max(0, Math.min(100, S.health));
  const bar = document.getElementById('hpBar');
  bar.style.width = hp + '%';
  bar.style.background = hp > 60
    ? 'linear-gradient(90deg,#3ddc84,#a8ff60)'
    : hp > 30
      ? 'linear-gradient(90deg,#ffd45e,#ff9a45)'
      : 'linear-gradient(90deg,#ff4d4d,#ff2020)';
  document.getElementById('wheelIn').style.transform = 'rotate(' + (S.steer*150) + 'deg)';
  document.getElementById('spdFx').style.opacity = Math.max(0, (S.speed-110)/70);
}
let msgT = null;
function showMsg(text, cls){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls || '';
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}

/* ═══════════ INPUT ═══════════ */
function bindHold(el, key){
  const on = e => { e.preventDefault(); IN[key]=true; el.classList.add('on'); Aud.init(); Aud.resume(); };
  const off = e => { e.preventDefault(); IN[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnBrake'), 'brake');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k==='arrowup'||k==='w') IN.gas = true;
  if(k==='arrowdown'||k==='s') IN.brake = true;
  if(k==='arrowleft'||k==='a') IN.left = true;
  if(k==='arrowright'||k==='d') IN.right = true;
  Aud.init(); Aud.resume();
});
addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w') IN.gas = false;
  if(k==='arrowdown'||k==='s') IN.brake = false;
  if(k==='arrowleft'||k==='a') IN.left = false;
  if(k==='arrowright'||k==='d') IN.right = false;
});

// կամերայի ղեկավարում աջ եզրից
(function(){
  const z = document.getElementById('camZone');
  let drag = false, sy = 0, sp = 0;
  const dn = e => { e.preventDefault(); drag=true; const t=e.touches?e.touches[0]:e; sy=t.clientY; sp=S.camPitch; };
  const mv = e => {
    if(!drag) return;
    e.preventDefault();
    const t = e.touches?e.touches[0]:e;
    const dy = t.clientY - sy;
    S.camPitch = Math.max(-0.3, Math.min(0.7, sp - dy/320));
  };
  const up = ()=> drag=false;
  z.addEventListener('touchstart', dn, {passive:false});
  z.addEventListener('touchmove', mv, {passive:false});
  z.addEventListener('touchend', up);
  z.addEventListener('mousedown', dn);
  addEventListener('mousemove', mv);
  addEventListener('mouseup', up);
  z.addEventListener('wheel', e=>{
    e.preventDefault();
    S.camPitch = Math.max(-0.3, Math.min(0.7, S.camPitch + e.deltaY*0.001));
  }, {passive:false});
})();

// կանխել ավելորդ գործողություններ
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
document.addEventListener('gestureend', e=>e.preventDefault());
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ═══════════ ՄԵՆՅՈՒ ═══════════ */
function buildMenu(){
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  const un = S.best.unlocked || 1;
  for(let i=1;i<=5;i++){
    const d = document.createElement('div');
    d.className = 'lvlBtn';
    if(i > un) d.classList.add('locked');
    if(S.best['lv'+i]) d.classList.add('done');
    d.innerHTML = '<div class="n">' + (S.best['lv'+i]?'★':i) + '</div><div class="t">' + LEVELS[i-1].name + '</div>';
    d.onclick = ()=>{ if(i>un) return; fs(); Aud.init(); Aud.resume(); startLevel(i); };
    wrap.appendChild(d);
  }
}
function fs(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  setTimeout(()=>{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }, 200);
}
document.getElementById('startBtn').onclick = ()=>{
  fs(); Aud.init(); Aud.resume();
  startLevel(Math.min(S.best.unlocked||1, 5));
};
function retryHandler(){
  Aud.resume();
  if(S.phase === 'win' && S.level < 5) startLevel(S.level+1);
  else startLevel(S.level);
}
document.getElementById('btnRetry').onclick = retryHandler;
document.getElementById('btnMenu').onclick = ()=>{
  S.phase = 'menu';
  clearTraffic();
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.remove('hide');
  Aud.stopMusic();
  buildMenu();
};
document.getElementById('pauseBtn').onclick = ()=>{
  if(S.phase === 'play' || S.phase === 'countdown'){
    S.phase = 'paused';
    document.getElementById('endTitle').textContent = 'ԿԱՆԳ';
    document.getElementById('endTitle').style.color = '#9fc6ff';
    document.getElementById('endSub').textContent = 'Դադարեցված է';
    document.getElementById('btnRetry').textContent = 'ՇԱՐՈՒՆԱԿԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
    document.getElementById('btnRetry').onclick = ()=>{
      document.getElementById('endScreen').classList.remove('show');
      S.phase = 'countdown';
      S.countdown = 1.5; S._lastC = undefined;
      document.getElementById('btnRetry').onclick = retryHandler;
      Aud.startMusic();
    };
  }
};

/* ═══════════ ՉԱՓԵՐ ═══════════ */
function resize(){
  const w = app.clientWidth || window.innerWidth;
  const h = app.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 120));

/* ═══════════ ՀԻՄՆԱԿԱՆ ՑԻԿԼ ═══════════ */
let lastT = performance.now();
let spawnT = 0;
let mapT = 0;

function loop(now){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.5, (now - lastT) / 1000); // իրական ժամանակ
  lastT = now;
  const dt = Math.min(0.033, rawDt); // physics-ի համար

  if(S.phase === 'countdown'){
    S.countdown -= rawDt; // ← ԻՐԱԿԱՆ ԺԱՄԱՆԱԿՈՎ
    const curN = Math.ceil(S.countdown);
    if(curN !== S._lastC){
      S._lastC = curN;
      if(curN === 2){ showMsg('2','gold'); Aud.beep(false); }
      else if(curN === 1){ showMsg('1','gold'); Aud.beep(false); }
      else if(curN <= 0){ showMsg('ԳՆԱ՛','green'); Aud.beep(true); }
    }
    if(S.countdown <= 0){
      S.phase = 'play';
      S.time = 0;
      S._lastC = undefined;
    }
    updateTraffic(dt * 0.4);
  } else if(S.phase === 'play'){
    S.time += rawDt;
    updatePhysics(dt);
    updateTraffic(dt);

    const lvl = LEVELS[S.level-1];
    spawnT -= dt;
    if(spawnT <= 0){
      spawnTraffic();
      spawnT = lvl.spawn * (0.7 + Math.random()*0.6);
    }
    checkCollisions();
  } else {
    updateTraffic(dt * 0.25);
    S.shake *= Math.pow(0.05, dt);
  }

  updateRoad(S.z);
  updateScenery(S.z);
  updateCamera(dt);
  updateHUD();
  updateObjective();

  mapT += rawDt;
  if(mapT > 0.05){ mapT = 0; drawMap(); }

  Aud.setEngine(S.speed, S.phase === 'play' || S.phase === 'countdown');

  renderer.render(scene, camera);
}

/* ═══════════ INIT ═══════════ */
buildMenu();
resize();
updateRoad(0);
updateScenery(0);
player.group.position.set(roadX(0) + LANE_OFF[2], 0, 0);
requestAnimationFrame(loop);

['touchstart','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, ()=>{ Aud.init(); Aud.resume(); }, {once:true});
});

})();
