<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02040a">
<title>Գիշերային Երթևեկություն</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#02040a;color:#fff;touch-action:none;overscroll-behavior:none;position:fixed}
#app{position:fixed;inset:0;overflow:hidden}
@media (orientation:portrait){
  #app{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 48%,rgba(0,0,0,.72) 100%)}
#spdFx{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at 50% 55%,rgba(80,140,255,0) 30%,rgba(120,160,255,.14) 70%,rgba(180,120,255,.22) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 30%,rgba(255,30,30,.7) 100%);transition:opacity .45s}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{background:linear-gradient(165deg,rgba(16,22,42,.84),rgba(8,12,24,.76));border:1px solid rgba(120,180,255,.2);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}

#topLeft{position:absolute;top:10px;left:10px;padding:9px 16px}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#7fd4ff;font-weight:700}
#distVal{font-size:19px;font-weight:800;margin-top:2px;background:linear-gradient(90deg,#fff,#a0dcff);-webkit-background-clip:text;background-clip:text;color:transparent}

#topRight{position:absolute;top:10px;right:10px;padding:9px 16px;text-align:right;min-width:140px}
#spdVal{font-size:33px;font-weight:900;line-height:1;letter-spacing:-1px;background:linear-gradient(90deg,#7ee7ff,#5eb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#spdUnit{font-size:10px;color:#8ea3c8;letter-spacing:3px;font-weight:700;margin-top:1px}
#hpWrap{margin-top:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#hpBar{height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#3ddc84,#a8ff60);transition:width .3s,background .3s}

#mapPanel{position:absolute;top:94px;right:10px;width:148px;height:148px;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,rgba(12,18,36,.82),rgba(6,10,22,.78));border:1px solid rgba(120,180,255,.26);box-shadow:0 8px 22px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
#mapCanvas{width:100%;height:100%;display:block}

#objWrap{position:absolute;top:58px;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center}
#objArrow{transition:transform .12s linear;filter:drop-shadow(0 4px 14px rgba(255,190,80,.7))}
#objLabel{font-size:11px;font-weight:800;letter-spacing:2px;color:#ffd45e;text-shadow:0 2px 10px rgba(0,0,0,.9);margin-top:2px}

#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:auto;padding:7px 18px;border-radius:12px;font-size:11px;letter-spacing:2px;font-weight:800;color:#9fc6ff;cursor:pointer;background:rgba(10,16,32,.7);border:1px solid rgba(120,180,255,.3);backdrop-filter:blur(8px);z-index:25}
#pauseBtn:active{background:rgba(30,50,90,.9)}

#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,rgba(30,42,74,.92),rgba(12,18,36,.92));border:2.5px solid rgba(130,190,255,.4);box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.14);color:#cfe4ff;font-weight:900;transition:transform .08s,background .12s,border-color .12s;touch-action:none}
.btn:active,.btn.on{transform:scale(.94);background:linear-gradient(160deg,rgba(80,140,255,.96),rgba(40,80,200,.96));border-color:rgba(180,220,255,.95);color:#fff}

#btnL{left:22px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnR{left:152px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnBrake{right:160px;bottom:28px;width:98px;height:98px;font-size:12px;letter-spacing:1.5px;border-color:rgba(255,120,120,.5);color:#ffb4b4}
#btnBrake:active,#btnBrake.on{background:linear-gradient(160deg,rgba(255,70,70,.96),rgba(180,20,20,.96));border-color:#ff9a9a}
#btnGas{right:26px;bottom:20px;width:126px;height:126px;font-size:16px;letter-spacing:2px;border-color:rgba(120,255,170,.5);color:#b6ffd4}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(50,230,130,.96),rgba(10,150,70,.96));border-color:#a8ffcf}

#wheelBox{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:112px;height:112px;pointer-events:none;z-index:19;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
#wheelIn{width:100%;height:100%;position:relative;transition:transform .05s linear}
.wRim{position:absolute;inset:0;border-radius:50%;border:10px solid transparent;background:linear-gradient(#0b1222,#0b1222) padding-box,conic-gradient(from 200deg,#2a3a5c,#48597f,#8fa8d8,#48597f,#2a3a5c,#1a2438,#48597f,#8fa8d8,#48597f,#2a3a5c) border-box;box-shadow:inset 0 0 14px rgba(0,0,0,.85),0 0 0 1px rgba(150,200,255,.2)}
.wSpk{position:absolute;left:50%;top:50%;width:12px;height:48px;margin-left:-6px;border-radius:4px;background:linear-gradient(180deg,#5f74a0,#2a3550);transform-origin:50% 0}
.w1{transform:rotate(180deg)}.w2{transform:rotate(60deg)}.w3{transform:rotate(-60deg)}
.wHub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a8fc0,#1b2438 70%);box-shadow:0 0 0 3px #0b1120,inset 0 2px 3px rgba(255,255,255,.28)}
.wMark{position:absolute;left:50%;top:4px;width:5px;height:15px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(180deg,#ff5b5b,#a01010);box-shadow:0 0 8px rgba(255,60,60,.9)}

#camZone{position:absolute;top:0;right:0;width:82px;height:100%;pointer-events:auto;z-index:21;touch-action:none}

#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:78px;font-weight:900;letter-spacing:8px;text-align:center;text-shadow:0 0 44px rgba(120,190,255,.9),0 6px 30px rgba(0,0,0,.85);pointer-events:none;opacity:0;z-index:30;white-space:nowrap}
#msg.show{animation:popMsg .9s ease-out}
@keyframes popMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
#msg.red{color:#ff5a5a;text-shadow:0 0 46px rgba(255,60,60,.95),0 6px 30px rgba(0,0,0,.85)}
#msg.gold{color:#ffd45e;text-shadow:0 0 46px rgba(255,200,60,.95),0 6px 30px rgba(0,0,0,.85)}
#msg.green{color:#8affc0;text-shadow:0 0 46px rgba(80,255,140,.9),0 6px 30px rgba(0,0,0,.85)}

.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,rgba(80,60,180,.42),transparent 62%),radial-gradient(ellipse at 50% 100%,rgba(255,110,60,.22),transparent 62%),linear-gradient(170deg,#070b18,#0d1226 45%,#160f22);transition:opacity .35s}
.screen.hide{opacity:0;pointer-events:none}

#title{font-size:clamp(34px,6.8vw,62px);font-weight:900;letter-spacing:10px;background:linear-gradient(90deg,#6ee7ff,#a78bfa,#ff8a5b,#ffd45e,#6ee7ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 0 28px rgba(120,180,255,.55))}
@keyframes shine{to{background-position:300% 0}}
#sub{font-size:11px;letter-spacing:7px;color:#7f93b8;margin-top:-6px;font-weight:700}
#levels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94vw;margin-top:8px}
.lvlBtn{width:76px;height:76px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,rgba(35,48,82,.96),rgba(14,20,38,.96));border:2px solid rgba(120,180,255,.34);box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .12s}
.lvlBtn:active{transform:scale(.93)}
.lvlBtn .n{font-size:24px;font-weight:900;color:#dceaff}
.lvlBtn .t{font-size:7.5px;letter-spacing:1.2px;color:#7f93b8;font-weight:700}
.lvlBtn.locked{opacity:.32;filter:grayscale(1);cursor:not-allowed}
.lvlBtn.done{border-color:rgba(80,255,160,.7);box-shadow:0 0 20px rgba(60,230,140,.35),0 6px 20px rgba(0,0,0,.5)}
.lvlBtn.done .n{color:#8affc0}
#startBtn{margin-top:4px;padding:15px 60px;border-radius:50px;cursor:pointer;font-size:19px;font-weight:900;letter-spacing:5px;color:#04121e;background:linear-gradient(90deg,#5eead4,#60a5fa,#a78bfa);background-size:220% 100%;border:none;box-shadow:0 10px 30px rgba(90,150,255,.5);animation:shine 3.8s linear infinite;transition:transform .12s}
#startBtn:active{transform:scale(.95)}
#hint{font-size:10px;color:#61748f;letter-spacing:2px;text-align:center;line-height:1.9;margin-top:4px;max-width:88vw}
.k{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(120,180,255,.16);border:1px solid rgba(120,180,255,.3);color:#a8ccff;font-weight:700;margin:0 2px}

#endScreen{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,rgba(10,16,32,.85),rgba(3,5,12,.97));backdrop-filter:blur(10px)}
#endScreen.show{display:flex}
#endTitle{font-size:clamp(30px,6vw,56px);font-weight:900;letter-spacing:8px}
#endSub{font-size:13px;letter-spacing:3px;color:#8ea3c8;text-align:center;padding:0 20px}
.endBtn{padding:13px 44px;border-radius:40px;cursor:pointer;font-size:15px;font-weight:900;letter-spacing:3px;border:2px solid rgba(130,190,255,.5);color:#cfe4ff;background:linear-gradient(160deg,rgba(40,60,110,.9),rgba(14,20,38,.9));transition:transform .11s}
.endBtn:active{transform:scale(.95)}
.endBtn.primary{background:linear-gradient(90deg,#5eead4,#60a5fa);color:#04121e;border:none;box-shadow:0 8px 26px rgba(90,150,255,.5)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="spdFx"></div>
  <div id="flash"></div>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ՄԱԿԱՐԴԱԿ 1</div>
      <div id="distVal">0 մ</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
      <div id="hpWrap"><div id="hpBar"></div></div>
    </div>

    <div id="mapPanel"><canvas id="mapCanvas" width="300" height="300"></canvas></div>

    <div id="objWrap">
      <svg id="objArrow" width="42" height="42" viewBox="0 0 42 42">
        <path d="M21 3 L33 33 L21 26 L9 33 Z" fill="#ffd45e" stroke="#a67c1a" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <div id="objLabel">0 մ</div>
    </div>

    <div id="pauseBtn">⏸</div>

    <div id="wheelBox">
      <div id="wheelIn">
        <div class="wRim"></div>
        <div class="wSpk w1"></div>
        <div class="wSpk w2"></div>
        <div class="wSpk w3"></div>
        <div class="wHub"></div>
        <div class="wMark"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnBrake">ԱՐԳԵԼ</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
  </div>
  <div id="camZone"></div>

  <div id="msg"></div>

  <div class="screen" id="menu">
    <div id="title">ԳԻՇԵՐԱՅԻՆ</div>
    <div id="sub">ԵՐԹԵՎԵԿՈՒԹՅՈՒՆ · 3D</div>
    <div id="levels"></div>
    <button id="startBtn">ՍԿՍԵԼ</button>
    <div id="hint">
      <span class="k">◀ ▶</span> ղեկ · <span class="k">ԳԱԶ</span> · <span class="k">ԱՐԳԵԼ</span> · Աջ եզրից ↕ կամերա<br>
      Հասի՛ր նպատակին, <b>կանգնի՛ր</b> · բախումը վտանգավոր է միայն 175+ կմ/ժ
    </div>
  </div>

  <div id="endScreen">
    <div id="endTitle">—</div>
    <div id="endSub">—</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <div class="endBtn primary" id="btnRetry">ԿՐԿՆԵԼ</div>
      <div class="endBtn" id="btnMenu">ՄԵՆՅՈՒ</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ══════════ ԿԱՅՈՒՆՆԵՐ ══════════ */
const ROAD_HALF = 9.5;
const SEG_LEN   = 6;
const NUM_SEG   = 180;
// ՁԱԽ = հանդիպակաց (բացասական X), ԱՋ = մեր ուղղություն (դրական X)
const LANE_OFF  = [-6.8, -2.3, 2.3, 6.8];
const MAX_KMH   = 180;
const LEVELS = [
  {len:2400, spawn:1.8, name:'ՔԱՂԱՔ'},
  {len:2800, spawn:1.5, name:'ՄԱՅՐՈՒՂԻ'},
  {len:3200, spawn:1.25,name:'ԽԱՉՄԵՐՈՒԿ'},
  {len:3600, spawn:1.05,name:'ԱՎՏՈԲԱՀՆ'},
  {len:4000, spawn:0.9, name:'ՄԵԾ ԽՃՈՒՄ'}
];

const S = {
  phase:'menu', level:1,
  x:0, z:0, vx:0, vz:0, heading:0,
  steer:0, speed:0, slip:0,
  health:100, levelLen:2400,
  hitCd:0, shake:0, time:0,
  camX:0, camY:0, camZ:0, camLX:0, camLY:0, camLZ:0,
  camPitch:0.1, camShake:0,
  countdown:0, _lc:undefined,
  best: JSON.parse(localStorage.getItem('nv4')||'{}')
};
const IN = { gas:false, brake:false, left:false, right:false, throttle:0 };

/* ══════════ ՁԱՅՆ — բարձր մակարդակ ══════════ */
const Aud = {
  ctx:null, ready:false, master:null,
  engGain:null, engFilt:null, engHP:null,
  o1:null,o2:null,o3:null,o4:null,
  lfo:null, lfoGain:null,
  noiseSrc:null, windGain:null,
  musicGain:null, musicTimer:null, step:0,
  reverb:null,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.75;
    // Soft compressor
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.ratio.value = 6;
    comp.attack.value = 0.005;
    comp.release.value = 0.2;
    this.master.connect(comp);
    comp.connect(this.ctx.destination);

    // ═══ ՇԱՐԺԻՉ ═══
    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilt = this.ctx.createBiquadFilter();
    this.engFilt.type = 'lowpass';
    this.engFilt.frequency.value = 280;
    this.engFilt.Q.value = 3.5;
    this.engHP = this.ctx.createBiquadFilter();
    this.engHP.type = 'highpass';
    this.engHP.frequency.value = 30;
    this.engFilt.connect(this.engGain);
    this.engGain.connect(this.master);

    const mk = (type, freq, gainVal) => {
      const o = this.ctx.createOscillator();
      o.type = type; o.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = gainVal;
      o.connect(g); g.connect(this.engFilt);
      o.start();
      return o;
    };
    this.o1 = mk('sine', 45, 1.0);
    this.o2 = mk('triangle', 67, 0.55);
    this.o3 = mk('sine', 90, 0.35);
    this.o4 = mk('sawtooth', 22, 0.18);

    // LFO vibrato
    this.lfo = this.ctx.createOscillator();
    this.lfo.frequency.value = 6.5;
    this.lfoGain = this.ctx.createGain();
    this.lfoGain.gain.value = 1.8;
    this.lfo.connect(this.lfoGain);
    this.lfoGain.connect(this.o1.frequency);
    this.lfoGain.connect(this.o2.frequency);
    this.lfo.start();

    // ═══ ՔԱՄԻ ԱՂՄՈՒԿ ═══
    const bufN = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, bufN, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufN;i++) d[i] = (Math.random()*2-1) * 0.5;
    this.noiseSrc = this.ctx.createBufferSource();
    this.noiseSrc.buffer = buf;
    this.noiseSrc.loop = true;
    const nf = this.ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 850; nf.Q.value = 0.8;
    this.windGain = this.ctx.createGain();
    this.windGain.gain.value = 0;
    this.noiseSrc.connect(nf); nf.connect(this.windGain);
    this.windGain.connect(this.master);
    this.noiseSrc.start();

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0;
    this.musicGain.connect(this.master);

    this.ready = true;
  },

  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  setEngine(kmh, gas, run){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const f = 38 + kmh * 0.85 + (gas ? 4 : 0);
    this.o1.frequency.setTargetAtTime(f, t, 0.10);
    this.o2.frequency.setTargetAtTime(f * 1.5 + 2, t, 0.10);
    this.o3.frequency.setTargetAtTime(f * 2.02, t, 0.10);
    this.o4.frequency.setTargetAtTime(f * 0.5, t, 0.10);
    this.engFilt.frequency.setTargetAtTime(220 + kmh * 5.5 + (gas ? 200 : 0), t, 0.15);
    const vol = run ? (0.05 + (kmh / MAX_KMH) * 0.12 + (gas ? 0.03 : 0)) : 0;
    this.engGain.gain.setTargetAtTime(vol, t, 0.2);
    this.windGain.gain.setTargetAtTime(run ? (kmh/MAX_KMH) * 0.05 : 0, t, 0.3);
  },

  _tone(freq, dur, type, vol, slide){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },

  crash(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * 0.7);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 1.6);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1600;
    const g = this.ctx.createGain(); g.gain.value = 0.5;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
    this._tone(160, 0.5, 'sine', 0.35, 35);
  },

  bump(f){ this._tone(200 + f*60, 0.22, 'sine', 0.06 + f*0.15, 90); },
  whoosh(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * 0.35);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++){
      const env = Math.sin(Math.PI * i/n);
      d[i] = (Math.random()*2-1) * env;
    }
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(1800, t);
    f.frequency.exponentialRampToValueAtTime(400, t+0.3);
    f.Q.value = 1.2;
    const g = this.ctx.createGain(); g.gain.value = 0.10;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  ding(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    [523,659,784,1046].forEach((f,i)=>{
      const o = this.ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + i*0.08);
      g.gain.exponentialRampToValueAtTime(0.14, t + i*0.08 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.08 + 0.7);
      o.connect(g); g.connect(this.master);
      o.start(t+i*0.08); o.stop(t+i*0.08+0.75);
    });
  },
  beep(long){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const dur = long ? 0.45 : 0.14;
    const f = long ? 780 : 540;
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f, t);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t+0.015);
    g.gain.setValueAtTime(0.35, t + dur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.06);
  },

  _mn(freq, at, dur, type, vol, cut){
    const o = this.ctx.createOscillator();
    o.type = type; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cut;
    o.connect(f); f.connect(g); g.connect(this.musicGain);
    o.start(at); o.stop(at+dur+0.1);
  },

  startMusic(){
    if(!this.ready || this.musicTimer) return;
    this.musicGain.gain.setTargetAtTime(0.5, this.ctx.currentTime, 1.8);
    // progression: Am - F - C - G
    const CH = [
      [220, 261.63, 329.63, 440],
      [174.61, 220, 261.63, 349.23],
      [130.81, 196, 261.63, 329.63],
      [196, 246.94, 293.66, 392]
    ];
    const BASS = [110, 87.31, 65.41, 98];
    const ARP = [
      523.25,659.25,783.99,659.25,523.25,440,392,440,
      440,523.25,659.25,523.25,440,392,349.23,392,
      523.25,659.25,783.99,1046, 783.99,659.25,523.25,392,
      392,493.88,587.33,493.88,392,349.23,329.63,392
    ];
    let next = this.ctx.currentTime + 0.15;
    this.step = 0;
    this.musicTimer = setInterval(()=>{
      if(!this.ready) return;
      while(next < this.ctx.currentTime + 0.4){
        const s = this.step % 32;
        if(s % 8 === 0){
          const chIdx = Math.floor(s/8);
          const ch = CH[chIdx];
          ch.forEach((f,i)=> this._mn(f, next, 3.6, 'sine', 0.032 - i*0.005, 1200));
          this._mn(BASS[chIdx], next, 3.4, 'sine', 0.055, 800);
        }
        this._mn(ARP[s], next, 0.85, 'triangle', 0.026, 2800);
        // soft hat
        if(s % 2 === 1){
          const t = next;
          const n = Math.floor(this.ctx.sampleRate * 0.04);
          const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 5);
          const src = this.ctx.createBufferSource(); src.buffer = buf;
          const f = this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6500;
          const g = this.ctx.createGain(); g.gain.value = 0.018;
          src.connect(f); f.connect(g); g.connect(this.musicGain);
          src.start(t);
        }
        next += 0.33;
        this.step++;
      }
    }, 100);
  },
  stopMusic(){
    if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer = null; }
    if(this.ready) this.musicGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
  }
};

function roadX(z){
  return 26*Math.sin(z*0.0042) + 11*Math.sin(z*0.0125) + 3.2*Math.sin(z*0.027);
}
function roadSlope(z){ const d = 0.6; return (roadX(z+d) - roadX(z-d))/(2*d); }
function roadH(z){ return Math.atan(roadSlope(z)); }

/* ԱՍՖԱԼՏԻ ԲԱՐՁՐ ՈՐԱԿԻ ՏԵՔՍՏՈՒՐԱ */
function makeRoadTex(){
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 1024;
  const x = cv.getContext('2d');
  // Base asphalt
  x.fillStyle = '#1c1f27';
  x.fillRect(0,0,512,1024);
  // Noise (many small dots)
  for(let i=0;i<18000;i++){
    const v = Math.random();
    x.fillStyle = v > 0.5 ? `rgba(255,255,255,${Math.random()*0.03})` : `rgba(0,0,0,${Math.random()*0.07})`;
    const size = 0.5 + Math.random()*1.5;
    x.fillRect(Math.random()*512, Math.random()*1024, size, size);
  }
  // Cracks (random lines)
  for(let i=0;i<14;i++){
    x.strokeStyle = `rgba(0,0,0,${0.15 + Math.random()*0.25})`;
    x.lineWidth = 0.5 + Math.random()*1.2;
    x.beginPath();
    let cx = Math.random()*512, cy = Math.random()*1024;
    x.moveTo(cx, cy);
    for(let j=0;j<8;j++){
      cx += (Math.random()-0.5)*60;
      cy += (Math.random()-0.5)*60;
      x.lineTo(cx, cy);
    }
    x.stroke();
  }
  // Oil stains
  for(let i=0;i<5;i++){
    const cx = 100 + Math.random()*312, cy = Math.random()*1024;
    const r = 20 + Math.random()*40;
    const grad = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(0,0,0,0.35)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad;
    x.beginPath(); x.arc(cx, cy, r, 0, 6.3); x.fill();
  }
  // Worn track centers (darker strips where wheels go)
  x.fillStyle = 'rgba(0,0,0,0.10)';
  x.fillRect(96, 0, 64, 1024);
  x.fillRect(352, 0, 64, 1024);
  // Center double yellow
  x.fillStyle = '#c9a53a';
  x.fillRect(251, 0, 4, 1024);
  x.fillRect(257, 0, 4, 1024);
  // Edge white lines
  x.fillStyle = '#dcdcdc';
  x.fillRect(8, 0, 5, 1024);
  x.fillRect(499, 0, 5, 1024);
  // Lane markers
  x.fillStyle = '#c8c8c8';
  for(let y=0;y<1024;y+=256){
    x.fillRect(163, y, 4, 128);
    x.fillRect(345, y, 4, 128);
  }
  // Edge wear (subtle dark edges)
  const gr = x.createLinearGradient(0,0,60,0);
  gr.addColorStop(0, 'rgba(0,0,0,0.35)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0,0,60,1024);
  const gr2 = x.createLinearGradient(512,0,452,0);
  gr2.addColorStop(0, 'rgba(0,0,0,0.35)');
  gr2.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr2; x.fillRect(452,0,60,1024);

  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

const WALL_H = 1.15;
function updateRoad(pz){
  const startZ = pz - 100;
  for(let i=0;i<=NUM_SEG;i++){
    const z = startZ + i*SEG_LEN;
    const cx = roadX(z);
    const o = i*6;
    rp[o]=cx-ROAD_HALF; rp[o+1]=0; rp[o+2]=z;
    rp[o+3]=cx+ROAD_HALF; rp[o+4]=0; rp[o+5]=z;
    const u = i*4;
    ru[u]=0; ru[u+1]=z/16;
    ru[u+2]=1; ru[u+3]=z/16;
    const w = i*12;
    bp[w]=cx-ROAD_HALF; bp[w+1]=WALL_H; bp[w+2]=z;
    bp[w+3]=cx-ROAD_HALF; bp[w+4]=0; bp[w+5]=z;
    bp[w+6]=cx+ROAD_HALF; bp[w+7]=WALL_H; bp[w+8]=z;
    bp[w+9]=cx+ROAD_HALF; bp[w+10]=0; bp[w+11]=z;
  }
  roadGeo.attributes.position.needsUpdate = true;
  roadGeo.attributes.uv.needsUpdate = true;
  bGeo.attributes.position.needsUpdate = true;

  // update strip lights (top of barrier, every 12m)
  const stripSpacing = 15;
  const baseZ = Math.floor((pz - 60) / stripSpacing) * stripSpacing;
  for(let i=0;i<STRIP_N;i++){
    const z = baseZ + i*stripSpacing;
    const cx = roadX(z);
    const sp = stripPoints[i];
    sp.l.position.set(cx - ROAD_HALF + 0.05, WALL_H, z);
    sp.r.position.set(cx + ROAD_HALF - 0.05, WALL_H, z);
  }
}

}

function makeBuildTex(hue){
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  const x = cv.getContext('2d');
  // base
  x.fillStyle = hue === 0 ? '#0c1018' : hue === 1 ? '#141016' : '#0e1420';
  x.fillRect(0,0,128,256);
  const cols = 6, rows = 14;
  const cw = 128/cols, ch = 256/rows;
  // windows
  for(let r=1;r<rows-1;r++){
    for(let c=1;c<cols-1;c++){
      const rnd = Math.random();
      if(rnd > 0.42){
        x.globalAlpha = 0.4 + Math.random()*0.6;
        const h = Math.random();
        x.fillStyle = h > 0.7 ? '#ffdc9a'
                    : h > 0.45 ? '#a8d8ff'
                    : h > 0.2 ? '#ffb477'
                    : '#e8f0ff';
        x.fillRect(c*cw + 2, r*ch + 2, cw - 4, ch - 4);
      }
    }
  }
  x.globalAlpha = 1;
  // window detail (small reflections)
  for(let i=0;i<200;i++){
    x.fillStyle = `rgba(255,255,255,${Math.random()*0.06})`;
    x.fillRect(Math.random()*128, Math.random()*256, 1, 1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}

function spawnTraffic(){
  const lvl = LEVELS[S.level-1];
  const free = POOL.find(c => !c.group.visible);
  if(!free) return;
  // lane: 0,1 = LEFT (oncoming), 2,3 = RIGHT (same dir)
  const lane = Math.floor(Math.random()*4);
  const oncoming = lane < 2;
  const z = S.z + 320 + Math.random()*300;
  let near = 0;
  for(const t of traffic) if(Math.abs(t.z - z) < 140) near++;
  if(near >= 2) return;
  for(const t of traffic) if(t.lane === lane && Math.abs(t.z - z) < 90) return;
  const spd = oncoming ? 16 + Math.random()*8 : 11 + Math.random()*7;
  free.group.visible = true;
  free.group.position.set(0, 0, z);
  traffic.push({
    obj: free, lane, off: LANE_OFF[lane], z,
    dir: oncoming ? -1 : 1, spd, oncoming,
    passed: false
  });
}

function updateTraffic(dt){
  for(let i=traffic.length-1;i>=0;i--){
    const t = traffic[i];
    t.z += t.dir * t.spd * dt;
    const cx = roadX(t.z) + t.off;
    t.obj.group.position.set(cx, 0, t.z);
    let h = Math.atan(roadSlope(t.z));
    if(t.dir < 0) h += Math.PI;
    t.obj.group.rotation.y = h;
    for(const w of t.obj.wheels) w.mesh.rotation.x -= t.spd * dt * 1.85;

    // Cleanup
    if(t.z < S.z - 70 || t.z > S.z + 1500){
      t.obj.group.visible = false;
      traffic.splice(i,1);
    }
  }
}
function clearTraffic(){
  for(const t of traffic) t.obj.group.visible = false;
  traffic.length = 0;
}

/* ══════════ ԲԱԽՈՒՄ ══════════ */
function checkCollisions(){
  if(S.hitCd > 0) return;
  for(let i=traffic.length-1;i>=0;i--){
    const t = traffic[i];
    const cx = t.obj.group.position.x;
    const cz = t.obj.group.position.z;
    if(Math.abs(S.x - cx) < 1.9 && Math.abs(S.z - cz) < 4.0){
      handleHit(t, i); return;
    }
  }
}
function handleHit(t, idx){
  S.hitCd = 0.8;
  const sp = S.speed;
  // Only instant crash at very high speed
  if(sp >= 175){
    Aud.crash();
    doCrash('ՎԹԱՐ', '175+ կմ/ժ բախում');
    return;
  }
  let dmg;
  if(sp >= 140) dmg = 55;
  else if(sp >= 100) dmg = 32;
  else if(sp >= 70) dmg = 20;
  else if(sp >= 40) dmg = 10;
  else if(sp >= 15) dmg = 4;
  else dmg = 1;
  S.health -= dmg;
  // Speed drop
  const drop = sp >= 80 ? 0.4 : 0.65;
  S.vx *= drop; S.vz *= drop;
  S.shake = Math.min(1.3, 0.35 + sp/200);
  flashDmg();
  Aud.bump(Math.min(1, sp/150));
  t.obj.group.visible = false;
  traffic.splice(idx,1);
  if(S.health <= 0){
    Aud.crash();
    doCrash('ՎԹԱՐ', 'Մեքենան վնասվեց');
  }
}
function flashDmg(){
  const e = document.getElementById('flash');
  e.style.transition = 'none'; e.style.opacity = '1';
  requestAnimationFrame(()=>{
    e.style.transition = 'opacity .5s'; e.style.opacity = '0';

}

/* ══════════ ՖԻԶԻԿԱ — DRIFT MODEL ══════════ */
function updatePhysics(dt){
  const lvl = LEVELS[S.level-1];

  // ═══ ՍԱՀՈՒՆ ՂԵԿ ═══
  let target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;
  // Սահուն մոտեցում
  const steerRate = 4.5;
  S.steer += (target - S.steer) * Math.min(1, steerRate * dt);
  // Սահուն վերադարձ կենտրոն
  if(!IN.left && !IN.right){
    S.steer += (0 - S.steer) * Math.min(1, 5.5 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  // ═══ ՎԵԼՈՍԻՏԻ ՎԵԿՏՈՐ ═══
  const fx = Math.sin(S.heading);
  const fz = Math.cos(S.heading);
  const rx = Math.cos(S.heading);
  const rz = -Math.sin(S.heading);

  let vF = S.vx*fx + S.vz*fz;
  let vR = S.vx*rx + S.vz*rz;

  const maxF_ms = MAX_KMH / 3.6;

  // ═══ ԳԱԶ ═══
  if(IN.gas){
    const sr = Math.max(0, vF) / maxF_ms;
    const aMul = 1 - Math.min(0.7, sr * sr);
    vF += 13.5 * aMul * dt;
  }
  // ═══ ԱՐԳԵԼ ═══
  if(IN.brake){
    if(vF > 0.5) vF -= 22 * dt;
    else vF -= 6 * dt;
  }
  // ═══ ԴԱՆԴԱՂԱՑՈՒՄ ═══
  if(!IN.gas && !IN.brake){
    if(Math.abs(vF) > 0.1) vF -= Math.sign(vF) * 3.5 * dt;
    else vF = 0;
  }
  // Air drag
  vF -= vF * 0.045 * dt;
  if(vF > maxF_ms) vF = maxF_ms;
  if(vF < -8) vF = -8;

  // ═══ ԿՈՂԱՅԻՆ ԿՑՈՒՄ (GRIP / DRIFT) ═══
  const speedAbs = Math.abs(vF);
  // Higher speed + high steering = less grip = drift
  const slipFactor = Math.abs(S.steer) * Math.min(1, speedAbs / 30);
  const gripBase = 14;
  const grip = gripBase * (1 - 0.78 * slipFactor);
  vR -= vR * Math.min(1, grip * dt);

  // ═══ ՊՏՈՒՅՏ ═══
  const spdFac = Math.min(1, speedAbs / 12);
  const turnRate = 1.55 * spdFac;
  // Աջ = heading աճում (դրական X ուղղություն)
  S.heading += S.steer * turnRate * dt;

  // ═══ ՆՈՐ ՎԵԿՏՈՐՆԵՐ ═══
  const fx2 = Math.sin(S.heading);
  const fz2 = Math.cos(S.heading);
  const rx2 = Math.cos(S.heading);
  const rz2 = -Math.sin(S.heading);

  S.vx = vF*fx2 + vR*rx2;
  S.vz = vF*fz2 + vR*rz2;

  // ═══ ԴԻՐՔ ═══
  S.x += S.vx * dt;
  S.z += S.vz * dt;

  // ═══ ՊԱՏՆԵՇ ═══
  const cX = roadX(S.z);
  const off = S.x - cX;
  const lim = ROAD_HALF - 1.3;
  if(off > lim){
    S.x = cX + lim;
    // Bounce soft
    S.vx -= Math.sign(S.vx) * Math.abs(S.vx) * 0.5;
    S.speed *= 0.96;
    S.shake = Math.max(S.shake, 0.08);
  } else if(off < -lim){
    S.x = cX - lim;
    S.vx -= Math.sign(S.vx) * Math.abs(S.vx) * 0.5;
    S.speed *= 0.96;
    S.shake = Math.max(S.shake, 0.08);
  }

  // ═══ ԱՐԱԳՈՒԹՅՈՒՆ (HUD) ═══
  S.speed = Math.abs(vF) * 3.6;
  S.slip = Math.min(1, Math.abs(vR) / Math.max(3, speedAbs));

  S.hitCd -= dt;

  // ═══ ՄԵՔԵՆԱՅԻ ՏԵՍՔ ═══
  player.group.position.set(S.x, 0, S.z);
  player.group.rotation.y = S.heading;

  const spin = Math.abs(vF) * dt * 1.85;
  for(const w of player.wheels){
    w.mesh.rotation.x -= spin;
    if(w.tag === 'fl' || w.tag === 'fr') w.mesh.rotation.y = S.steer * 0.5;
  }
  // Թեքվածություն (roll) սայթաքելիս
  const roll = -S.steer * 0.06 - vR * 0.008;
  player.group.rotation.z = roll;

  // Brake lights
  const braking = IN.brake || (!IN.gas && S.speed > 3);
  player.tailGlow.material.opacity = braking ? 1.0 : 0.55;
  player.tlMat.color.setHex(braking ? 0xff1010 : 0xff2020);

  // ═══ SKID MARKS ═══
  if(S.slip > 0.18 && speedAbs > 8){
    const rxW = Math.cos(S.heading);
    const rzW = -Math.sin(S.heading);
    const bxo = Math.sin(S.heading);
    const bzo = Math.cos(S.heading);
    // Rear wheel world positions
    const wxL = S.x - bxo*1.5 + rxW*-1.02;
    const wzL = S.z - bzo*1.5 + rzW*-1.02;
    const wxR = S.x - bxo*1.5 + rxW*1.02;
    const wzR = S.z - bzo*1.5 + rzW*1.02;
    if(Math.random() < 0.6){
      placeSkid(wxL, wzL, S.heading);
      placeSkid(wxR, wzR, S.heading);
    }
  }

  // ═══ ԿԱՆԳԱՌԻ ԳՈՏԻ ═══
  const zoneStart = S.levelLen - 220;
  if(S.z >= zoneStart && S.z < S.levelLen + 30 && S.phase === 'play'){
    if(S.speed < 6) doWin();
  }
  if(S.z > S.levelLen + 40 && S.phase === 'play'){
    Aud.crash();
    doCrash('ԲԱԽՈՒՄ', 'Անցար վերջնագիծը առանց կանգնելու');
  }
}

/* ══════════ ԱՆՑՆՈՂ ՄԵՔԵՆԱՆԵՐԻ ՓՉՈՑ ══════════ */
function checkTrafficWake(dt){
  for(const t of traffic){
    const cx = t.obj.group.position.x;
    const cz = t.obj.group.position.z;
    const dx = S.x - cx;
    const dz = S.z - cz;
    const d2 = dx*dx + dz*dz;
    if(d2 < 49){ // within 7m
      const d = Math.sqrt(d2);
      // Lateral push
      const push = (1 - d/7) * 3.5;
      const nx = dx / Math.max(0.5, d);
      S.vx += nx * push * dt * 3;
      // Whoosh once
      if(!t.passed && d < 4.5){
        t.passed = true;
        Aud.whoosh();
        S.camShake = Math.max(S.camShake, 0.3);
      }
    } else if(t.passed === false && d2 > 64){
      // reset if too far
    }
  }
}

/* ══════════ ԿԱՄԵՐԱ — սահուն, կինեմատոգրաֆիկ ══════════ */
function updateCamera(dt){
  const h = S.heading;
  const fx = Math.sin(h), fz = Math.cos(h);

  const dist = 7.8 - S.camPitch * 3.0;
  const high = 2.6 + S.camPitch * 4.2;

  const tx = S.x - fx * dist;
  const ty = high;
  const tz = S.z - fz * dist;

  const k = 1 - Math.exp(-11 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  const lx = S.x + fx * 16 + S.steer * 2.5;
  const ly = 1.2;
  const lz = S.z + fz * 16;
  const lk = 1 - Math.exp(-14 * dt);
  S.camLX += (lx - S.camLX) * lk;
  S.camLY += (ly - S.camLY) * lk;
  S.camLZ += (lz - S.camLZ) * lk;

  let sx=0, sy=0, sz=0;
  if(S.camShake > 0.005){
    sx = (Math.random()-0.5) * S.camShake;
    sy = (Math.random()-0.5) * S.camShake * 0.7;
    S.camShake *= Math.pow(0.05, dt);
    if(S.camShake < 0.005) S.camShake = 0;
  }
  if(S.shake > 0.005){
    sx += (Math.random()-0.5) * S.shake * 1.0;
    sy += (Math.random()-0.5) * S.shake * 0.8;
    S.shake *= Math.pow(0.03, dt);
    if(S.shake < 0.005) S.shake = 0;
  }

  camera.position.set(S.camX + sx, S.camY + sy, S.camZ + sz);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);

  // Speed FOV
  const tFov = 70 + (S.speed / MAX_KMH) * 16;
  camera.fov += (tFov - camera.fov) * Math.min(1, 3*dt);
  camera.updateProjectionMatrix();

  // Subtle roll
  camera.rotation.z += S.steer * 0.02 + S.slip * 0.04;
}

/* ══════════ HUD + MAP + ARROW ══════════ */
const mapCv = document.getElementById('mapCanvas');
const mapCtx = mapCv.getContext('2d');
function drawMap(){
  const w = mapCv.width, h = mapCv.height;
  mapCtx.clearRect(0,0,w,h);
  const grad = mapCtx.createRadialGradient(w/2,h/2,20,w/2,h/2,w*0.75);
  grad.addColorStop(0,'rgba(20,32,58,0.9)');
  grad.addColorStop(1,'rgba(6,10,22,0.55)');
  mapCtx.fillStyle = grad;
  mapCtx.fillRect(0,0,w,h);

  const range = 300;
  const cx = w/2, cy = h/2;
  const sc = w / range;

  // Road
  mapCtx.strokeStyle = 'rgba(120,180,255,0.55)';
  mapCtx.lineWidth = 24 * sc;
  mapCtx.lineCap = 'round';
  mapCtx.lineJoin = 'round';
  mapCtx.beginPath();
  let first = true;
  for(let z = S.z - range/2; z <= S.z + range/2; z += 10){
    const mx = cx + (roadX(z) - S.x) * sc;
    const my = cy - (z - S.z) * sc;
    if(first){ mapCtx.moveTo(mx,my); first = false; }
    else mapCtx.lineTo(mx,my);
  }
  mapCtx.stroke();

  // Center line
  mapCtx.strokeStyle = 'rgba(220,180,60,0.5)';
  mapCtx.lineWidth = 1.2;
  mapCtx.beginPath();
  first = true;
  for(let z = S.z - range/2; z <= S.z + range/2; z += 10){
    const mx = cx + (roadX(z) - S.x) * sc;
    const my = cy - (z - S.z) * sc;
    if(first){ mapCtx.moveTo(mx,my); first = false; }
    else mapCtx.lineTo(mx,my);
  }
  mapCtx.stroke();

  // Traffic
  for(const t of traffic){
    const tx = cx + (t.obj.group.position.x - S.x) * sc;
    const ty = cy - (t.obj.group.position.z - S.z) * sc;
    if(tx < -6 || tx > w+6 || ty < -6 || ty > h+6) continue;
    mapCtx.fillStyle = t.oncoming ? '#ff5a5a' : '#ffd45e';
    mapCtx.beginPath(); mapCtx.arc(tx, ty, 4, 0, 6.3); mapCtx.fill();
  }

  // Finish
  const fz = S.levelLen;
  const fx = cx + (roadX(fz) - S.x) * sc;
  const fy = cy - (fz - S.z) * sc;
  if(fy > -20 && fy < h+20){
    mapCtx.fillStyle = '#8affc0';
    mapCtx.beginPath(); mapCtx.arc(fx, fy, 9, 0, 6.3); mapCtx.fill();
    mapCtx.strokeStyle = '#fff'; mapCtx.lineWidth = 2; mapCtx.stroke();
    mapCtx.fillStyle = '#000';
    mapCtx.font = 'bold 11px sans-serif';
    mapCtx.textAlign = 'center';
    mapCtx.textBaseline = 'middle';
    mapCtx.fillText('⚑', fx, fy+1);
  }

  // Player
  mapCtx.save();
  mapCtx.translate(cx, cy);
  mapCtx.rotate(-S.heading);
  mapCtx.fillStyle = '#5eead4';
  mapCtx.beginPath();
  mapCtx.moveTo(0, -11); mapCtx.lineTo(-7, 9); mapCtx.lineTo(7, 9);
  mapCtx.closePath(); mapCtx.fill();
  mapCtx.strokeStyle = '#fff'; mapCtx.lineWidth = 1.5; mapCtx.stroke();
  mapCtx.restore();
}

const arrowEl = document.getElementById('objArrow');
const labelEl = document.getElementById('objLabel');
function updateObjective(){
  const dz = S.levelLen - S.z;
  const dx = roadX(S.levelLen) - S.x;
  const dist = Math.sqrt(dx*dx + dz*dz);
  const rel = Math.atan2(dx, dz) - S.heading;
  arrowEl.style.transform = 'rotate(' + (rel * 180/Math.PI) + 'deg)';
  arrowEl.style.opacity = dist < 200 ? '0.45' : '1';
  labelEl.textContent = Math.max(0, Math.round(dist)) + ' մ';
}

function updateHUD(){
  const sp = Math.round(S.speed);
  const e = document.getElementById('spdVal');
  e.textContent = sp;
  if(sp >= 150) e.style.background = 'linear-gradient(90deg,#ff5a5a,#ff2b2b)';
  else if(sp >= 100) e.style.background = 'linear-gradient(90deg,#ffd36e,#ff7a45)';
  else e.style.background = 'linear-gradient(90deg,#7ee7ff,#5eb0ff)';
  e.style.webkitBackgroundClip = 'text';
  e.style.backgroundClip = 'text';

  const rem = Math.max(0, S.levelLen - S.z);
  document.getElementById('distVal').textContent = Math.round(rem) + ' մ';

  const hp = Math.max(0, Math.min(100, S.health));
  const bar = document.getElementById('hpBar');
  bar.style.width = hp + '%';
  bar.style.background = hp > 60
    ? 'linear-gradient(90deg,#3ddc84,#a8ff60)'
    : hp > 30
      ? 'linear-gradient(90deg,#ffd45e,#ff9a45)'
      : 'linear-gradient(90deg,#ff4d4d,#ff2020)';

  document.getElementById('wheelIn').style.transform = 'rotate(' + (S.steer*150) + 'deg)';
  document.getElementById('spdFx').style.opacity = Math.max(0, (S.speed-110)/70);
}

let msgT = null;
function showMsg(text, cls){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls || '';
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}

/* ══════════ INPUT ══════════ */
function bindHold(el, key){
  const on = e => { e.preventDefault(); IN[key]=true; el.classList.add('on'); Aud.init(); Aud.resume(); };
  const off = e => { e.preventDefault(); IN[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnBrake'), 'brake');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k==='arrowup'||k==='w') IN.gas = true;
  if(k==='arrowdown'||k==='s') IN.brake = true;
  if(k==='arrowleft'||k==='a') IN.left = true;
  if(k==='arrowright'||k==='d') IN.right = true;
  Aud.init(); Aud.resume();
});
addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w') IN.gas = false;
  if(k==='arrowdown'||k==='s') IN.brake = false;
  if(k==='arrowleft'||k==='a') IN.left = false;
  if(k==='arrowright'||k==='d') IN.right = false;
});

(function(){
  const z = document.getElementById('camZone');
  let drag = false, sy = 0, sp = 0;
  const dn = e => { e.preventDefault(); drag = true; const t = e.touches?e.touches[0]:e; sy = t.clientY; sp = S.camPitch; };
  const mv = e => {
    if(!drag) return;
    e.preventDefault();
    const t = e.touches?e.touches[0]:e;
    const dy = t.clientY - sy;
    S.camPitch = Math.max(-0.25, Math.min(0.75, sp - dy/320));
  };
  const up = ()=> drag = false;
  z.addEventListener('touchstart', dn, {passive:false});
  z.addEventListener('touchmove', mv, {passive:false});
  z.addEventListener('touchend', up);
  z.addEventListener('mousedown', dn);
  addEventListener('mousemove', mv);
  addEventListener('mouseup', up);
  z.addEventListener('wheel', e=>{
    e.preventDefault();
    S.camPitch = Math.max(-0.25, Math.min(0.75, S.camPitch + e.deltaY*0.001));
  }, {passive:false});
})();

document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
document.addEventListener('gestureend', e=>e.preventDefault());
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ══════════ MENU ══════════ */
function buildMenu(){
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  const un = S.best.unlocked || 1;
  for(let i=1;i<=5;i++){
    const d = document.createElement('div');
    d.className = 'lvlBtn';
    if(i > un) d.classList.add('locked');
    if(S.best['lv'+i]) d.classList.add('done');
    d.innerHTML = '<div class="n">' + (S.best['lv'+i]?'★':i) + '</div><div class="t">' + LEVELS[i-1].name + '</div>';
    d.onclick = ()=>{ if(i>un) return; fs(); Aud.init(); Aud.resume(); startLevel(i); };
    wrap.appendChild(d);
  }
}
function fs(){
  const el = document.documentElement;
  try{
    if(el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  setTimeout(()=>{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }, 200);
}
document.getElementById('startBtn').onclick = ()=>{
  fs(); Aud.init(); Aud.resume();
  startLevel(Math.min(S.best.unlocked||1, 5));
};
function retryHandler(){
  Aud.resume();
  if(S.phase === 'win' && S.level < 5) startLevel(S.level+1);
  else startLevel(S.level);
}
document.getElementById('btnRetry').onclick = retryHandler;
document.getElementById('btnMenu').onclick = ()=>{
  S.phase = 'menu';
  clearTraffic();
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('menu').classList.remove('hide');
  Aud.stopMusic();
  buildMenu();
};
document.getElementById('pauseBtn').onclick = ()=>{
  if(S.phase === 'play' || S.phase === 'countdown'){
    S.phase = 'paused';
    document.getElementById('endTitle').textContent = 'ԿԱՆԳ';
    document.getElementById('endTitle').style.color = '#9fc6ff';
    document.getElementById('endSub').textContent = 'Դադարեցված է';
    document.getElementById('btnRetry').textContent = 'ՇԱՐՈՒՆԱԿԵԼ';
    document.getElementById('endScreen').classList.add('show');
    Aud.stopMusic();
    document.getElementById('btnRetry').onclick = ()=>{
      document.getElementById('endScreen').classList.remove('show');
      S.phase = 'countdown';
      S.countdown = 1.5; S._lc = undefined;
      document.getElementById('btnRetry').onclick = retryHandler;
      Aud.startMusic();
    };
  }
};

/* ══════════ ՉԱՓԵՐ ══════════ */
function resize(){
  const w = app.clientWidth || window.innerWidth;
  const h = app.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 120));

/* ══════════ ՑԻԿԼ ══════════ */
let lastT = performance.now();
let spawnT = 0;
let mapT = 0;

function loop(now){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.4, (now - lastT) / 1000);
  lastT = now;
  const dt = Math.min(0.028, rawDt);

  if(S.phase === 'countdown'){
    S.countdown -= rawDt;
    const c = Math.ceil(S.countdown);
    if(c !== S._lc){
      S._lc = c;
      if(c === 2){ showMsg('2','gold'); Aud.beep(false); }
      else if(c === 1){ showMsg('1','gold'); Aud.beep(false); }
      else if(c <= 0){ showMsg('ԳՆԱ՛','green'); Aud.beep(true); }
    }
    if(S.countdown <= 0){
      S.phase = 'play';
      S.time = 0;
      S._lc = undefined;
    }
    updateTraffic(dt * 0.4);
  } else if(S.phase === 'play'){
    S.time += rawDt;
    updatePhysics(dt);
    updateTraffic(dt);
    checkTrafficWake(dt);

    const lvl = LEVELS[S.level-1];
    spawnT -= dt;
    if(spawnT <= 0){
      spawnTraffic();
      spawnT = lvl.spawn * (0.7 + Math.random()*0.6);
    }
    checkCollisions();
  } else {
    updateTraffic(dt * 0.25);
    S.shake *= Math.pow(0.05, dt);
  }

  updateRoad(S.z);
  updateScenery(S.z);
  updateSkid(dt);
  updateCamera(dt);
  updateHUD();
  updateObjective();

  mapT += rawDt;
  if(mapT > 0.05){ mapT = 0; drawMap(); }

  Aud.setEngine(S.speed, IN.gas, S.phase === 'play' || S.phase === 'countdown');

  renderer.render(scene, camera);
}

/* ══════════ INIT ══════════ */
buildMenu();
resize();
updateRoad(0);
updateScenery(0);
player.group.position.set(roadX(0) + LANE_OFF[2], 0, 0);
requestAnimationFrame(loop);

['touchstart','mousedown','keydown'].forEach(ev=>{
  window.addEventListener(ev, ()=>{ Aud.init(); Aud.resume(); }, {once:true});
});

})();
</script>
